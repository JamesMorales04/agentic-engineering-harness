version: 1

task:
  id: PAWRA-142
  title: Location-scoped membership permissions

source:
  proposal: specs/changes/PAWRA-142/proposal.md
  spec: specs/changes/PAWRA-142/spec.md
  design: specs/changes/PAWRA-142/design.md
  acceptance: specs/changes/PAWRA-142/acceptance.feature

git:
  baseRef: main

scope:
  allowed:
    - src/**/Organizations/**
    - src/**/Memberships/**
    - tests/**/Organizations/**
    - tests/**/Memberships/**
  forbidden:
    - src/**/Auth/**
    - src/**/Payments/**
  frozen:
    - .harness/contracts/PAWRA-142.yaml
    - tests/**/Acceptance/Frozen/**

requirements:
  - id: PAWRA-142-R1
    description: Location permission overrides are evaluated correctly.
    validator: gherkin:LocationPermissionOverrides
  - id: PAWRA-142-R2
    description: Cross-tenant membership access is rejected.
    validator: gherkin:CrossTenantMembershipRejected

constraints:
  breakingApiChanges: false
  newDependencies: false
  schemaChanges: false
  maxFilesChanged: 30
  maxLinesAdded: 1800
  maxLinesDeleted: 800

verification:
  commands:
    - id: tenant-isolation-acceptance
      command: dotnet test --filter "Category=TenantIsolation"
      required: true
