version: 1

project:
  name: agentic-engineering-harness

agents:
  configPath: .harness/agents.source.jsonc
  generatedPath: .harness/generated/agents.json
  activeProfile: balanced
  required: true
  findingsDir: .harness/findings

controlPlane:
  snapshotDir: .harness/controller
  required: true
  include: []

workflow:
  quick:
    maxFiles: 5
    disallowedDomains: [security, authentication, authorization, architecture, database, schema, migration, api-contract]
  issueIntake:
    enabled: true
    snapshotDir: .harness/issues
    verifyDriftOnRun: true
    requireOpen: true
    plannerAgent: planner
    autoHandoff: true
  planning:
    enabled: true
    plannerAgent: planner
    worktreeIsolation: true
    barrierValidation: true
    maxWaveConcurrency: 4
    distributed: false
  reviews:
    enabled: true
    reviewQuick: false
    leadAcceptance: true
    leadAcceptanceQuick: false
    quality:
      severityPoints: { critical: 300, high: 75, medium: 24, low: 3, note: 1 }
    convergence:
      minimumDebtPointImprovement: 3
      stagnationWindow: 2
      cycleDetection: true
      regressionDetection: true
    finalQualityGate:
      maxBySeverity: { critical: 0, high: 0, medium: 0, low: 3 }
      maxDebtPoints: 9
    escalation:
      criticalStartStage: 2
      replanResumeStage: 2
      stages:
        - { name: normal, action: remediate }
        - { name: quality, action: remediate, agent: quality-implementer }
        - { name: senior, action: remediate, agent: senior-implementer, model: "@brain" }
        - { name: diagnosis, action: diagnose, agent: oracle, model: "@brain" }
        - { name: replan, action: replan, agent: planner, model: "@brain" }

orchestration:
  provider: paseo
  required: false
  worker:
    provider: opencode
    model: deepseek-v4-flash
    maxRepairAttempts: 2
    timeoutSeconds: 1800
    titlePrefix: aeh-self

toolchain:
  configPath: .harness/toolchain.yaml
  lockPath: .harness/toolchain.lock.json
  statePath: .harness/toolchain.state.json
  generatedMisePath: .config/mise/conf.d/aeh.toml

mcp:
  servers:
    context7: { type: remote, url: https://mcp.context7.com/mcp, oauth: false, enabled: true }
    playwright: { type: local, command: [npx, -y, "@playwright/mcp@0.0.78"], enabled: true, timeoutMs: 30000 }
    github:
      type: local
      command: [podman, run, -i, --rm, -e, GITHUB_PERSONAL_ACCESS_TOKEN, -e, GITHUB_TOOLSETS, -e, GITHUB_READ_ONLY, ghcr.io/github/github-mcp-server]
      environment:
        GITHUB_PERSONAL_ACCESS_TOKEN: "{env:GITHUB_TOKEN}"
        GITHUB_TOOLSETS: repos,issues,pull_requests,actions
        GITHUB_READ_ONLY: "1"
      enabled: true
      timeoutMs: 30000
    sentry: { type: remote, url: https://mcp.sentry.dev/mcp, enabled: false, timeoutMs: 10000 }
  benchmark:
    enabled: false
    resultsDir: .harness/mcp-benchmarks
    repetitions: 3
  packs:
    research: { servers: [context7], enabled: true }
    browser: { servers: [playwright, context7], enabled: true }
    github-readonly: { servers: [github], enabled: true }
    observability: { servers: [sentry], enabled: false }

delivery:
  stateDir: .harness/delivery
  github:
    enabled: false
    tokenEnv: GH_TOKEN
    assignTokenOwner: true
    labels: []
    branchPattern: feature/gh-{issue}-{slug}
    finalizeOnAcceptance: true
    pullRequestDraft: true
  paseo:
    enabled: false
    createWorkspace: true
    autoUseWorkspace: true
    worktreeSlugPattern: gh-{issue}-{slug}

memory:
  provider: none
  required: false

codeIntelligence:
  provider: none
  required: false
  scheduling:
    useEdges: true
    maxGraphHops: 1
    maxSharedNodes: 0
    centralityConflictThreshold: 0.35

evidence:
  enabled: true
  outputDir: .harness/evidence
  requireComplete: true

organization:
  policyBundles:
    cacheDir: .harness/policy-bundles
    required: false
    sources: []

distributed:
  enabled: false
  provider: filesystem
  queueDir: .harness/distributed
  pollIntervalMs: 1000
  leaseSeconds: 1800

sdd:
  specsDir: specs
  contractsDir: .harness/contracts
  reportsDir: .harness/reports
  repairsDir: .harness/repairs
  runsDir: .harness/runs

validation:
  baseRef: main
  requireSeal: true
  commands:
    - id: npm-check
      command: npm run check
      required: true
      timeoutSeconds: 900

security:
  sandbox:
    provider: none
    required: false
    network: true
    readOnlyRoot: true
    ephemeralHome: true
    noNewPrivileges: true
    capDropAll: true
    pidsLimit: 512
    forceForRisks: []
    environmentAllowlist: []
    credentialEnvAllowlist: []

telemetry:
  enabled: false
  required: false
  exporter: none

evals:
  corpusDir: evals/corpus
  resultsDir: .harness/evals/results
  workspacesDir: .harness/evals/workspaces
  defaultRuns: 5
  confidenceLevel: 0.95

provenance:
  outputDir: .harness/provenance
  buildType: https://github.com/JamesMorales04/agentic-engineering-harness/v0.5
