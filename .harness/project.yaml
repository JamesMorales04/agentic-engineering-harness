version: 1

project:
  name: agentic-engineering-harness

agents:
  configPath: .harness/agents.source.jsonc
  generatedPath: .harness/generated/agents.json
  activeProfile: balanced
  required: true
  findingsDir: .harness/findings

workflow:
  quick:
    maxFiles: 5
    disallowedDomains:
      - security
      - authentication
      - authorization
      - architecture
      - database
      - schema
      - migration
      - api-contract
  issueIntake:
    enabled: true
    snapshotDir: .harness/issues
    verifyDriftOnRun: true
    requireOpen: true
    plannerAgent: planner
    autoHandoff: true
  reviews:
    enabled: true
    reviewQuick: false
    leadAcceptance: true
    leadAcceptanceQuick: false
    quality:
      severityPoints:
        critical: 300
        high: 75
        medium: 24
        low: 3
        note: 1
    convergence:
      minimumDebtPointImprovement: 3
      stagnationWindow: 2
      cycleDetection: true
      regressionDetection: true
    finalQualityGate:
      maxBySeverity:
        critical: 0
        high: 0
        medium: 0
        low: 3
      maxDebtPoints: 9
    escalation:
      criticalStartStage: 2
      replanResumeStage: 2
      stages:
        - { name: normal, action: remediate }
        - { name: quality, action: remediate, agent: quality-implementer }
        - { name: senior, action: remediate, agent: senior-implementer, model: "@brain" }
        - { name: diagnosis, action: diagnose, agent: oracle, model: "@brain" }
        - { name: replan, action: replan, agent: planner, model: "@brain" }

orchestration:
  provider: paseo
  required: false
  worker:
    provider: opencode
    model: deepseek-v4-flash
    maxRepairAttempts: 2
    timeoutSeconds: 1800
    titlePrefix: aeh-self

toolchain:
  configPath: .harness/toolchain.yaml
  lockPath: .harness/toolchain.lock.json
  statePath: .harness/toolchain.state.json
  generatedMisePath: .config/mise/conf.d/aeh.toml

mcp:
  servers:
    context7:
      type: remote
      url: https://mcp.context7.com/mcp
      oauth: false
      enabled: true
    playwright:
      type: local
      command: [npx, -y, "@playwright/mcp@0.0.78"]
      enabled: true
      timeoutMs: 30000
    github:
      type: local
      command: [podman, run, -i, --rm, -e, GITHUB_PERSONAL_ACCESS_TOKEN, -e, GITHUB_TOOLSETS, -e, GITHUB_READ_ONLY, ghcr.io/github/github-mcp-server]
      environment:
        GITHUB_PERSONAL_ACCESS_TOKEN: "{env:GITHUB_TOKEN}"
        GITHUB_TOOLSETS: repos,issues,pull_requests,actions
        GITHUB_READ_ONLY: "1"
      enabled: true
      timeoutMs: 30000
    sentry:
      type: remote
      url: https://mcp.sentry.dev/mcp
      enabled: false
      timeoutMs: 10000

delivery:
  stateDir: .harness/delivery
  github:
    enabled: false
    tokenEnv: GH_TOKEN
    assignTokenOwner: true
    labels: []
    branchPattern: feature/gh-{issue}-{slug}
  paseo:
    enabled: false
    createWorkspace: true
    autoUseWorkspace: true
    worktreeSlugPattern: gh-{issue}-{slug}

memory:
  provider: none
  required: false

codeIntelligence:
  provider: none
  required: false

sdd:
  specsDir: specs
  contractsDir: .harness/contracts
  reportsDir: .harness/reports
  repairsDir: .harness/repairs
  runsDir: .harness/runs

validation:
  baseRef: main
  requireSeal: true
  commands:
    - id: npm-check
      command: npm run check
      required: true
      timeoutSeconds: 900

security:
  sandbox:
    provider: none
    required: false
    network: true

telemetry:
  enabled: false
  required: false
  exporter: none

evals:
  corpusDir: evals/corpus
  resultsDir: .harness/evals/results
  workspacesDir: .harness/evals/workspaces

provenance:
  outputDir: .harness/provenance
  buildType: https://github.com/JamesMorales04/agentic-engineering-harness
