name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Smoke repo-local self CLI resolution
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          test -x ./node_modules/.bin/aeh
          ./node_modules/.bin/aeh --version | grep -Fx "$EXPECTED_VERSION"
          npm exec -- aeh --version | grep -Fx "$EXPECTED_VERSION"
          npm exec -- aeh --help | grep -q 'operation start audit|run'
      - run: npm run release:check
      - name: Smoke packaged CLI from consumer install
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          TGZ="$(npm pack --silent)"
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/consumer"
          cd "$TMP/consumer"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TGZ" >/dev/null
          ./node_modules/.bin/aeh --version | grep -Fx "$EXPECTED_VERSION"
          TOOLS="$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | ./node_modules/.bin/aeh operation mcp)"
          printf '%s\n' "$TOOLS" | grep -q 'aeh_operation_start_audit'
          printf '%s\n' "$TOOLS" | grep -q 'aeh_context_status'
          mkdir repo
          ./node_modules/.bin/aeh init repo
          test -f repo/.harness/project.yaml
          test -f repo/.harness/toolchain.yaml
          test -f repo/.harness/provider-versions.json
          test -f repo/.harness/agents.source.jsonc
          test -f repo/.harness/skills/engineering-workflow/SKILL.md
          test -f repo/.harness/managed-assets.json
          test -f repo/openspec/config.yaml
          grep -q '"aeh:orchestration"' repo/.harness/agents.source.jsonc
          grep -q '^    sessionPolicy: fresh-on-start$' repo/.harness/project.yaml
          grep -q '^    provider: openspec$' repo/.harness/project.yaml
          grep -q 'npm:@fission-ai/openspec' repo/.harness/toolchain.yaml
          test -d repo/.harness/paseo
          test -d repo/.harness/paseo/handoffs
          test -d repo/.harness/audits
          test -d repo/.harness/operations
          grep -q '^\.harness/\*$' repo/.gitignore
          grep -q '^!\.harness/project.yaml$' repo/.gitignore
          grep -q '^!\.harness/toolchain.yaml$' repo/.gitignore
          grep -q '^!\.harness/agents.source.jsonc$' repo/.gitignore
          grep -q '^!\.harness/otel-collector.yaml$' repo/.gitignore
          ./node_modules/.bin/aeh toolchain compile repo
          test -f repo/.config/mise/conf.d/aeh.toml
          grep -q 'openspec' repo/.config/mise/conf.d/aeh.toml
          rm repo/.harness/skills/engineering-workflow/SKILL.md
          ./node_modules/.bin/aeh setup --dry-run repo
          test -f repo/.harness/skills/engineering-workflow/SKILL.md
          ./node_modules/.bin/aeh policy sync repo >/dev/null
          ./node_modules/.bin/aeh intent 'review the repo and validate the code for improvements' repo | grep -q '^AUDIT'
          ./node_modules/.bin/aeh operation status DOES-NOT-EXIST repo >/dev/null 2>&1 && exit 1 || true

  scenario-matrix:
    name: scenario-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run test:scenario

  adversarial-system:
    name: adversarial-system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run test:adversarial

  human-e2e:
    name: human-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run test:human-e2e

  full-stack-contract:
    name: full-stack-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.0
          install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - name: Install pinned full-stack providers
        shell: bash
        run: |
          set -euo pipefail
          VERSIONS=templates/provider-versions.json
          HEADROOM_VERSION="$(node -p "require('./$VERSIONS').headroom")"
          GRAPHIFY_VERSION="$(node -p "require('./$VERSIONS').graphify")"
          SERENA_VERSION="$(node -p "require('./$VERSIONS').serena")"
          ENGRAM_VERSION="$(node -p "require('./$VERSIONS').engram")"
          TRIVY_VERSION="$(node -p "require('./$VERSIONS').trivy")"
          PNPM_VERSION="$(node -p "require('./$VERSIONS').pnpm")"
          mkdir -p "$RUNNER_TEMP/aeh-provider-tools"
          (cd "$RUNNER_TEMP/aeh-provider-tools" && mise use --yes "npm:pnpm@$PNPM_VERSION" "aqua:aquasecurity/trivy@$TRIVY_VERSION")
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          (cd "$RUNNER_TEMP/aeh-provider-tools" && mise bin-paths) >> "$GITHUB_PATH"
          uv tool install "headroom-ai[all]==$HEADROOM_VERSION"
          uv tool install "graphifyy==$GRAPHIFY_VERSION"
          uv tool install "serena-agent==$SERENA_VERSION"
          npm install --global "@engram-ai-memory/cli@$ENGRAM_VERSION"
          test "$(cd "$RUNNER_TEMP/aeh-provider-tools" && mise exec -- pnpm --version)" = "$PNPM_VERSION"
          (cd "$RUNNER_TEMP/aeh-provider-tools" && mise exec -- trivy --version) | grep -F "Version: $TRIVY_VERSION"
      - name: Start Engram local server
        shell: bash
        run: |
          set -euo pipefail
          engram setup --no-mcp --non-interactive
          engram start
      - name: Run strict full-stack production contract
        env:
          AEH_STRICT_FULL_STACK: "1"
        run: npx vitest run tests/architectureClosureIntegration.test.ts

  provider-contracts:
    name: provider-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.0
          install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - name: Install pinned local provider contracts
        shell: bash
        run: |
          set -euo pipefail
          VERSIONS=templates/provider-versions.json
          HEADROOM_VERSION="$(node -p "require('./$VERSIONS').headroom")"
          GRAPHIFY_VERSION="$(node -p "require('./$VERSIONS').graphify")"
          SERENA_VERSION="$(node -p "require('./$VERSIONS').serena")"
          ENGRAM_VERSION="$(node -p "require('./$VERSIONS').engram")"
          TRIVY_VERSION="$(node -p "require('./$VERSIONS').trivy")"
          OPENGREP_VERSION="$(node -p "require('./$VERSIONS').opengrep")"
          PNPM_VERSION="$(node -p "require('./$VERSIONS').pnpm")"
          mkdir -p "$RUNNER_TEMP/aeh-provider-tools"
          (cd "$RUNNER_TEMP/aeh-provider-tools" && mise use --yes "npm:pnpm@$PNPM_VERSION" "aqua:aquasecurity/trivy@$TRIVY_VERSION" "aqua:opengrep/opengrep@$OPENGREP_VERSION")
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          (cd "$RUNNER_TEMP/aeh-provider-tools" && mise bin-paths) >> "$GITHUB_PATH"
          uv tool install "headroom-ai[all]==$HEADROOM_VERSION"
          uv tool install "graphifyy==$GRAPHIFY_VERSION"
          uv tool install "serena-agent==$SERENA_VERSION"
          npm install --global "@engram-ai-memory/cli@$ENGRAM_VERSION"
          test "$(cd "$RUNNER_TEMP/aeh-provider-tools" && mise exec -- pnpm --version)" = "$PNPM_VERSION"
          (cd "$RUNNER_TEMP/aeh-provider-tools" && mise exec -- trivy --version) | grep -F "Version: $TRIVY_VERSION"
          (cd "$RUNNER_TEMP/aeh-provider-tools" && mise exec -- opengrep --version) | grep -F "$OPENGREP_VERSION"
          npx playwright install --with-deps chromium
      - name: Start Engram local server
        shell: bash
        run: |
          set -euo pipefail
          engram setup --no-mcp --non-interactive
          engram start
      - name: Run real provider contracts
        env:
          AEH_RUN_REAL_PROVIDERS: "1"
        run: npx vitest run tests/providerContracts.test.ts

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/provenance.test.ts
      - uses: jdx/mise-action@v4
        with:
          version: 2026.7.0
          install: false
      - uses: sigstore/cosign-installer@v3.7.0
      - name: Install the pinned Trivy provider
        shell: bash
        run: |
          set -euo pipefail
          TRIVY_VERSION="$(node -p "require('./templates/provider-versions.json').trivy")"
          mkdir -p "$RUNNER_TEMP/aeh-provider-tools"
          (cd "$RUNNER_TEMP/aeh-provider-tools" && mise use --yes "aqua:aquasecurity/trivy@$TRIVY_VERSION")
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          (cd "$RUNNER_TEMP/aeh-provider-tools" && mise bin-paths) >> "$GITHUB_PATH"
          (cd "$RUNNER_TEMP/aeh-provider-tools" && mise exec -- trivy --version) | grep -F "Version: $TRIVY_VERSION"
      - name: Generate an ephemeral non-production Cosign key
        env:
          COSIGN_PASSWORD: ''
        run: |
          cosign generate-key-pair
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parse, stringify } from 'yaml';
          const file = '.harness/project.yaml';
          const document = parse(fs.readFileSync(file, 'utf8'));
          document.provenance = {
            ...(document.provenance ?? {}),
            sbom: { ...(document.provenance?.sbom ?? {}), required: true },
            signing: { ...(document.provenance?.signing ?? {}), required: true, key: 'cosign.key' },
            verification: { ...(document.provenance?.verification ?? {}), required: true, publicKey: 'cosign.pub' }
          };
          fs.writeFileSync(file, stringify(document));
          NODE
      - name: Generate and verify the production-path evidence chain
        env:
          COSIGN_PASSWORD: ''
        run: |
          printf 'supply-chain-fixture\n' > supply-chain-fixture.txt
          node dist/main.js provenance generate --artifact supply-chain-fixture.txt --sign .
          node dist/main.js provenance verify .
      - name: Confirm tampering is rejected
        env:
          COSIGN_PASSWORD: ''
        run: |
          printf 'tampered\n' >> supply-chain-fixture.txt
          if node dist/main.js provenance verify .; then
            echo 'tampered supply-chain evidence was accepted' >&2
            exit 1
          fi

  validation-contracts:
    name: validation provider contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm test -- --run tests/validationProviders.test.ts tests/maturityEvidence.test.ts

  contract-testing:
    name: real Pact provider verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Install the official local Pact CLI
        run: cargo install pact --locked
      - run: npm test -- --run tests/validationProviders.test.ts

  integration-environment:
    name: OCI integration environment contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Run the capability-gated OCI fixture
        run: docker run --rm --network none alpine:3.20 sh -c 'test "$(printf ready)" = ready'
      - run: npm test -- --run tests/validationProviders.test.ts
