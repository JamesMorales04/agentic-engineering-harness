name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - name: Normalize v0.5.1 release metadata once
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const cli = 'src/cli.ts';
          let cliText = fs.readFileSync(cli, 'utf8');
          cliText = cliText.replace('.version("0.5.0")', '.version("0.5.1")');
          fs.writeFileSync(cli, cliText);
          const file = 'README.md';
          let text = fs.readFileSync(file, 'utf8');
          text = text.replace('## Status: v0.5.0', '## Status: v0.5.1');
          text = text.replace('v0.5.0 closes the original architecture with hard-frozen control planes, executable multi-worker planner waves, requirement evidence graphs, hardened sandboxes, distributed workers and organization governance.', 'v0.5.1 adds a zero-friction Paseo entrypoint on top of the v0.5 architecture: start AEH once, then type normal engineering prompts in the persistent Paseo lead and let the Harness choose and execute the complete workflow automatically.');
          text = text.replace('See [docs/V0.5.md](docs/V0.5.md), [docs/V0.4.16.md](docs/V0.4.16.md) and the earlier v0.4 documentation.', 'See [docs/V0.5.1.md](docs/V0.5.1.md), [docs/V0.5.md](docs/V0.5.md) and the earlier version documentation.');
          text = text.replaceAll('agentic-engineering-harness@0.5.0', 'agentic-engineering-harness@0.5.1');
          const marker = '## Recommended installation';
          if (!text.includes('## Start AEH + Paseo')) {
            text = text.replace(marker, `## Start AEH + Paseo\n\nThe default interactive workflow is now one command:\n\n\`\`\`bash\naeh start\n# or\nnpm exec aeh -- start\n\`\`\`\n\nThis starts or reuses the Paseo daemon and creates/reuses a persistent **AEH Lead** session. Open that session in Paseo and type a normal request such as \`add rate limiting to the auth endpoints\`. For every repository-changing prompt, the lead automatically inspects the repository, builds triage evidence, runs QUICK/SPEC classification, materializes and seals the appropriate contract, invokes the Harness, and owns the resulting planner/worker/validation/evidence/review/acceptance flow. You do not need to mention AEH or choose the internal workflow. Read-only questions remain direct and non-mutating.\n\nUse \`aeh start --new\` to create a fresh lead session. AEH does not rewrite global \`~/.paseo/config.json\`; project-local session state lives under gitignored \`.harness/paseo/\`.\n\n${marker}`);
          }
          fs.writeFileSync(file, text);
          NODE
          npm install --package-lock-only --ignore-scripts >/dev/null
          if git diff --quiet -- README.md package-lock.json src/cli.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md package-lock.json src/cli.ts
          git commit -m "chore(release): finish v0.5.1 metadata alignment"
          git push origin "HEAD:${{ github.head_ref }}"
      - run: npm run release:check
      - name: Smoke packaged CLI from consumer install
        shell: bash
        run: |
          set -euo pipefail
          TGZ="$(npm pack --silent)"
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/consumer"
          cd "$TMP/consumer"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TGZ" >/dev/null
          ./node_modules/.bin/aeh --version | grep -Fx '0.5.1'
          mkdir repo
          ./node_modules/.bin/aeh init repo
          test -f repo/.harness/project.yaml
          test -f repo/.harness/toolchain.yaml
          test -f repo/.harness/agents.source.jsonc
          grep -q '^  interactive:$' repo/.harness/project.yaml
          test -d repo/.harness/paseo
          grep -q '^\.harness/paseo/$' repo/.gitignore
          ./node_modules/.bin/aeh toolchain compile repo
          test -f repo/.config/mise/conf.d/aeh.toml
          ./node_modules/.bin/aeh setup --dry-run repo
          ./node_modules/.bin/aeh policy sync repo >/dev/null
