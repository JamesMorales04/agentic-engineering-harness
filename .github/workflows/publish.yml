name: publish-npm

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version strategy when the current package version is already published
        required: true
        default: auto
        type: choice
        options: [auto, current, patch, minor, major]

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-npm-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.AEH_AUTO_PUBLISH != 'false'
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_publish: ${{ steps.version.outputs.should_publish }}
      release_sha: ${{ steps.release-commit.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REQUESTED_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'auto' }}
        run: node scripts/release-version.mjs "$REQUESTED_BUMP" >> "$GITHUB_STEP_SUMMARY"

      - name: Synchronize package metadata
        if: steps.version.outputs.should_publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Validate release candidate
        if: steps.version.outputs.should_publish == 'true'
        run: npm run release:check

      - name: Commit version
        id: release-commit
        if: steps.version.outputs.should_publish == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${RELEASE_VERSION}"
            git push origin HEAD:main
          fi
          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Repair missing GitHub Release for current version
        if: steps.version.outputs.should_publish != 'true' && github.event_name == 'workflow_dispatch' && inputs.bump == 'current'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Narrow repair gate: pre-screen for exactly the published-but-unreleased
          # state. A tag proves NOTHING about verification (manual or legacy tags
          # predate tag-after-verify) — trust is established only by the
          # verify-published job re-running verification for R in THIS run, which
          # the repair-release job needs for success. SHA-binding (tag == HEAD ==
          # version commit) proves identity; npm-confirms-published proves
          # publicity. All other states refuse as before (no
          # verification-skipped Release, no rebuild/republish here — the
          # repair-release job owns the SHA-bound Release creation after verify).
          TAG="v${RELEASE_VERSION}"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          # SIGPIPE-safe existence check: query the exact ref and test for
          # nonempty output. The previous full-namespace ls-remote piped to
          # grep -q misdetected existing tags under `pipefail` (grep -q
          # closes the pipe while git is still streaming, git dies 141).
          # The awk exact-match filter keeps this correct even if a server
          # answers a ref query with pattern/suffix matches (awk consumes
          # all stdin, so it cannot SIGPIPE the producer).
          TAG_REF="refs/tags/${TAG}"
          REMOTE_REF="$(git ls-remote origin "$TAG_REF" | awk -v want="$TAG_REF" '$2 == want')"
          if [ -z "$REMOTE_REF" ]; then
            echo "Refusing to create GitHub Release for v${RELEASE_VERSION} without in-workflow verification." >&2
            echo "The bump=current repair path cannot skip verification: re-run the full release pipeline so commit -> verify (by SHA) -> tag + npm publish -> release all succeed in one workflow run." >&2
            exit 1
          fi
          PEELED_SHA="$(git ls-remote origin "refs/tags/${TAG}^{}" | awk -v want="refs/tags/${TAG}^{}" '$2 == want {print $1}')"
          if [ -z "$PEELED_SHA" ]; then
            PEELED_SHA="$(git ls-remote origin "$TAG_REF" | awk -v want="$TAG_REF" '$2 == want {print $1}')"
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$PEELED_SHA" != "$HEAD_SHA" ]; then
            echo "Refusing to create GitHub Release for v${RELEASE_VERSION}: tag ${TAG} at ${PEELED_SHA} does not match HEAD ${HEAD_SHA} (never force-move)." >&2
            exit 1
          fi
          if [ "$(node -p "require('./package.json').version")" != "$RELEASE_VERSION" ]; then
            echo "Refusing to create GitHub Release for v${RELEASE_VERSION}: HEAD version does not match (SHA-binding failed)." >&2
            exit 1
          fi
          # Existence is not identity: the registry tarball must byte-match a
          # fresh build of this revision (integrity mismatch fails closed —
          # never release foreign same-version content). Single pack, retained
          # tarball reuse: never repack for the compare (rebuild-nondeterminism safe).
          npm run build --silent
          RETAIN_TMP="$(mktemp -d)"
          npm pack --pack-destination "$RETAIN_TMP" --silent >/dev/null
          RETAIN_TARBALL="$(ls "$RETAIN_TMP"/*.tgz | head -n 1)"
          if node scripts/ci/verify-npm-identity.mjs "$PACKAGE_NAME" "$RELEASE_VERSION" --tarball "$RETAIN_TARBALL"; then
            echo "Repair eligible: tag ${TAG} at ${PEELED_SHA} == HEAD, version ${RELEASE_VERSION} verified identical on npm. The repair-release job will create the SHA-bound Release (no rebuild/republish)."
          else
            code=$?
            if [ "$code" -eq 2 ]; then
              echo "Refusing to create GitHub Release for v${RELEASE_VERSION}: version is not on npm (nothing published to repair)." >&2
            elif [ "$code" -eq 3 ]; then
              echo "Refusing to create GitHub Release for v${RELEASE_VERSION}: registry lookup UNKNOWN (network/auth/parse, fail closed, never release on UNKNOWN)." >&2
            else
              echo "Refusing to create GitHub Release for v${RELEASE_VERSION}: registry tarball content differs from this revision (integrity mismatch, fail closed)." >&2
            fi
            exit 1
          fi

      - name: Nothing to publish
        if: steps.version.outputs.should_publish != 'true'
        run: echo "Current package version is already published and bump=current was requested."

  verify-published:
    name: verify-published
    needs: publish
    # Normal path (should_publish) AND repair path (manual dispatch bump=current
    # with nothing to publish): a manually created or legacy tag at R proves
    # nothing, so the repair leg must EXECUTE verification for R in this run —
    # the repair Release job needs this job's success. No Release without it.
    if: needs.publish.outputs.should_publish == 'true' || (needs.publish.outputs.should_publish != 'true' && github.event_name == 'workflow_dispatch' && inputs.bump == 'current')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        if: needs.publish.outputs.should_publish == 'true'
        with:
          ref: ${{ needs.publish.outputs.release_sha }}
          fetch-depth: 0

      - uses: actions/checkout@v6
        if: needs.publish.outputs.should_publish != 'true'
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm ci

      - name: Confirm release commit
        if: needs.publish.outputs.should_publish == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          git fetch origin "$RELEASE_SHA"
          git checkout --detach "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"

      - name: Confirm repair revision R (tag-bound, SHA-verified)
        if: needs.publish.outputs.should_publish != 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          # Repair leg: resolve R as HEAD and bind it by SHA. The tag is NOT
          # trusted as proof of verification — it is only an identity claim
          # (tag == HEAD, version matches) checked BEFORE the verification steps
          # below execute against these exact bits.
          TAG="v${RELEASE_VERSION}"
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TAG_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          test -n "$TAG_SHA"
          test "$TAG_SHA" = "$HEAD_SHA"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          test "$(git describe --tags --exact-match HEAD)" = "$TAG"
          echo "Repair verification target R=$HEAD_SHA bound to ${TAG}."

      - name: Provision the required consumer toolchain provider
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y podman
          podman --version

      - name: Run packaged build and hygiene contracts
        run: npm run test:packaged-consumer

      - name: Smoke packaged CLI from consumer install
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          npm run build
          PACKAGE_NAME="$(node -p "require('./package.json').name.replace(/^@/, '').replaceAll('/', '-')")"
          PACK_DESTINATION="$(mktemp -d "$RUNNER_TEMP/aeh-packaged-consumer.XXXXXX")"
          AEH_PACK_DESTINATION="$PACK_DESTINATION" node scripts/ci/packCandidate.mjs
          TGZ="$PACK_DESTINATION/$PACKAGE_NAME-$EXPECTED_VERSION.tgz"
          test -s "$TGZ"
          sha256sum "$TGZ"
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/consumer"
          cd "$TMP/consumer"
          npm init -y >/dev/null
          npm install "$TGZ" >/dev/null
          ./node_modules/.bin/aeh --version | grep -Fx "$EXPECTED_VERSION"
          TOOLS="$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | ./node_modules/.bin/aeh operation mcp)"
          printf '%s\n' "$TOOLS" | grep -q 'aeh_operation_start_audit'
          printf '%s\n' "$TOOLS" | grep -q 'aeh_context_status'
          mkdir repo
          ./node_modules/.bin/aeh init repo
          test -f repo/.harness/project.yaml
          test -f repo/.harness/toolchain.yaml
          test -f repo/.harness/provider-versions.json
          test -f repo/.harness/agents.source.jsonc
          test -f repo/.harness/skills/engineering-workflow/SKILL.md
          test -f repo/.harness/managed-assets.json
          test -f repo/openspec/config.yaml
          grep -q '"aeh:orchestration"' repo/.harness/agents.source.jsonc
          grep -q '^    sessionPolicy: fresh-on-start$' repo/.harness/project.yaml
          grep -q '^    provider: openspec$' repo/.harness/project.yaml
          grep -q 'npm:@fission-ai/openspec' repo/.harness/toolchain.yaml
          test -d repo/.harness/paseo
          test -d repo/.harness/paseo/handoffs
          test -d repo/.harness/audits
          test -d repo/.harness/operations
          grep -q '^\.harness/\*$' repo/.gitignore
          grep -q '^!\.harness/project.yaml$' repo/.gitignore
          grep -q '^!\.harness/toolchain.yaml$' repo/.gitignore
          grep -q '^!\.harness/agents.source.jsonc$' repo/.gitignore
          grep -q '^!\.harness/otel-collector.yaml$' repo/.gitignore
          ./node_modules/.bin/aeh toolchain compile repo
          test -f repo/.config/mise/conf.d/aeh.toml
          grep -q 'openspec' repo/.config/mise/conf.d/aeh.toml
          rm repo/.harness/skills/engineering-workflow/SKILL.md
          ./node_modules/.bin/aeh setup --dry-run repo
          test -f repo/.harness/skills/engineering-workflow/SKILL.md
          ./node_modules/.bin/aeh policy sync repo >/dev/null
          mkdir -p repo/.harness/fixtures
          cat > repo/.harness/fixtures/deterministic-paseo-runtime.json <<'EOF'
          {
            "version": 1,
            "responses": {
              "semantic-assessment:INTENT": [
                {
                  "judgment": {
                    "type": "INTENT",
                    "intent": "audit",
                    "confidence": 1,
                    "evidenceRefs": ["request"]
                  },
                  "claims": [],
                  "assumptions": [],
                  "unknowns": [],
                  "recommendations": [],
                  "knowledgeGaps": []
                }
              ]
            }
          }
          EOF
          AEH_DETERMINISTIC_PASEO_RUNTIME=1 AEH_PASEO_FORCE_CLI=0 ./node_modules/.bin/aeh intent 'review the repo and validate the code for improvements' repo | grep -q '^AUDIT'
          ./node_modules/.bin/aeh operation status DOES-NOT-EXIST repo >/dev/null 2>&1 && exit 1 || true

  publish-npm:
    name: publish-npm
    needs: [publish, verify-published]
    if: needs.publish.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish.outputs.release_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: Create version tag after verification
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -n "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          TAG="v${RELEASE_VERSION}"
          # SIGPIPE-safe existence check (same pattern as the repair gate):
          # exact-ref query with an emptiness test, no full-namespace pipe
          # under `pipefail`.
          TAG_REF="refs/tags/${TAG}"
          # Standalone assignment (not embedded in `[ ... ]`): under
          # `set -euo pipefail` a failed lookup is fatal here (fail-closed
          # UNKNOWN) instead of silently selecting the "tag absent" branch.
          TAG_LOOKUP="$(git ls-remote origin "$TAG_REF" | awk -v want="$TAG_REF" '$2 == want')"
          if [ -n "$TAG_LOOKUP" ]; then
            PEELED_SHA="$(git ls-remote origin "refs/tags/${TAG}^{}" | awk -v want="refs/tags/${TAG}^{}" '$2 == want {print $1}')"
            if [ -z "$PEELED_SHA" ]; then
              PEELED_SHA="$(git ls-remote origin "$TAG_REF" | awk -v want="$TAG_REF" '$2 == want {print $1}')"
            fi
            if [ "$PEELED_SHA" = "$RELEASE_SHA" ]; then
              echo "Tag ${TAG} already points at $RELEASE_SHA; resuming idempotently (no recreation, never force-move)."
              git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" || git fetch origin tag "${TAG}"
            else
              echo "Tag ${TAG} already exists on origin at ${PEELED_SHA}, expected $RELEASE_SHA; refusing to reuse a stale tag (never force-move). Nothing has been published by this run." >&2
              exit 1
            fi
          else
            # Idempotent local creation: a retry whose checkout already
            # fetched the tag resumes instead of failing with
            # `fatal: tag 'vX' already exists` (run 37989905139). A
            # pre-existing local tag MUST bind to this run's RELEASE_SHA or
            # the job fails WITHOUT pushing (never publish a divergent tag;
            # the TAG_SHA bind below remains normative in all cases).
            if git rev-parse -q --verify "$TAG_REF" >/dev/null; then
              LOCAL_SHA="$(git rev-list -n 1 "$TAG_REF")"
              if [ "$LOCAL_SHA" != "$RELEASE_SHA" ]; then
                echo "Local tag ${TAG} at ${LOCAL_SHA} does not match RELEASE_SHA ${RELEASE_SHA}; refusing to push a divergent tag (never force-move)." >&2
                exit 1
              fi
            else
              git tag -a "${TAG}" -m "${TAG}" "$RELEASE_SHA"
            fi
            git push origin "${TAG}"
          fi
          TAG_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"
          if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
            echo "Tag ${TAG} verification failed: expected $RELEASE_SHA but got $TAG_SHA." >&2
            exit 1
          fi

      - name: Confirm verified tag before publishing
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-list -n 1 "v$RELEASE_VERSION")" = "$RELEASE_SHA"
          test "$(git describe --tags --exact-match HEAD)" = "v$RELEASE_VERSION"

      - run: npm run build

      - name: Restore retained release tarball (retry reuse)
        uses: actions/download-artifact@v4
        with:
          name: aeh-npm-tarball
          path: ${{ runner.temp }}/aeh-npm-retained
          if-no-files-found: warn
        continue-on-error: true

      - name: Pack release tarball (reuse retained on retry)
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
        run: |
          set -euo pipefail
          # N1: single pack per attempt, retained for retry+publish+confirm.
          # Retry downloads THE SAME tarball above and skips repacking, so a
          # publish-then-fail-later retry never repacks differently (exit 1 forever).
          # Provenance (Luna blocker fix): the retained tarball is bound to
          # release_sha by a sidecar (npm-provenance.json: release_sha +
          # tarball sha512 + name/version) written at fresh-pack time and
          # uploaded ALONGSIDE the tarball. Reuse verifies the sidecar
          # (release_sha match + digest recompute + name/version match);
          # absent/invalid/mismatched sidecar fails closed (refuse publish AND
          # Release). Fresh-pack fallback (missing artifact -> pack from the
          # verified checkout) stays as-is.
          test -n "${RELEASE_SHA:-}"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          RETAIN_DIR="${RUNNER_TEMP:-$PWD}/aeh-npm-retained"
          mkdir -p "$RETAIN_DIR"
          if ls "$RETAIN_DIR"/*.tgz >/dev/null 2>&1; then
            TARBALL="$(ls "$RETAIN_DIR"/*.tgz | head -n 1)"
            if [ ! -f "$RETAIN_DIR/npm-provenance.json" ]; then
              echo "Refusing to reuse retained tarball $TARBALL: missing provenance sidecar npm-provenance.json for release_sha=$RELEASE_SHA (fail closed; stale/replaced artifact? refusing publish and Release)." >&2
              exit 1
            fi
            node scripts/ci/verify-artifact-provenance.mjs --tarball "$TARBALL" --provenance "$RETAIN_DIR/npm-provenance.json" --release-sha "$RELEASE_SHA" --name "$PACKAGE_NAME" --version "$RELEASE_VERSION" || {
              echo "Refusing to reuse retained tarball $TARBALL: provenance verification failed for release_sha=$RELEASE_SHA (fail closed; refusing publish and Release)." >&2
              exit 1
            }
            echo "Reusing retained tarball (no repack; rebuild-nondeterminism safe; provenance verified): $TARBALL"
          else
            PACK_OUT="$(npm pack --pack-destination "$RETAIN_DIR" --silent)"
            echo "Packed first tarball for retain+reuse: $PACK_OUT"
            TARBALL="$(ls "$RETAIN_DIR"/*.tgz | head -n 1)"
            test -s "$TARBALL"
            node scripts/ci/verify-artifact-provenance.mjs --write --tarball "$TARBALL" --provenance "$RETAIN_DIR/npm-provenance.json" --release-sha "$RELEASE_SHA"
            test -s "$RETAIN_DIR/npm-provenance.json"
          fi
          TARBALL="$(ls "$RETAIN_DIR"/*.tgz | head -n 1)"
          test -s "$TARBALL"
          test -s "$RETAIN_DIR/npm-provenance.json"
          # Digest-only fallback: record the first-pack digest; retry compares the
          # registry integrity against the RECORDED digest when tarball reuse is infeasible.
          node -e "const fs=require('node:fs'),crypto=require('node:crypto');const b=fs.readFileSync(process.argv[1]);process.stdout.write('sha512-'+crypto.createHash('sha512').update(b).digest('base64')+'\n')" "$TARBALL" > "$RETAIN_DIR/npm-identity.digest"
          test -s "$RETAIN_DIR/npm-identity.digest"
          echo "Retained $TARBALL + provenance sidecar + digest for retry."

      - name: Recheck retained tarball before upload (TOCTOU bind)
        shell: bash
        run: |
          set -euo pipefail
          # TOCTOU bind: recompute sha512 of the exact bytes about to be
          # uploaded and compare to the sidecar digest (fail closed on
          # mismatch). The upload-artifact action is a separate step, so this
          # shell step runs immediately before it to narrow the window.
          # U1 scope bind (round-4): EXACT verified filename crosses the artifact
          # boundary — deterministic package-name-version.tgz, NO glob in the
          # upload step. The guard below selects exactly ONE survivor (fail
          # closed on 0 or >1: siblings fail closed here), rechecks its bytes,
          # then pins its EXACT basename via GITHUB_ENV. The upload step consumes
          # ${{ env.VERIFIED_TARBALL_BASENAME }} as an explicit file path, so a
          # sibling landing between this guard and the upload action cannot
          # escape (it is never named). Upload is not a trust boundary: any
          # swap that slips through the cross-step gap is still caught by the
          # pre-consume recheck before publish and by post-publish attestation
          # after publish (detect-and-deprecate).
          RETAIN_DIR="${RUNNER_TEMP:-$PWD}/aeh-npm-retained"
          mapfile -t CANDIDATES < <(ls "$RETAIN_DIR"/*.tgz 2>/dev/null || true)
          if [ "${#CANDIDATES[@]}" -ne 1 ]; then
            echo "Refusing upload: expected exactly ONE retained tarball in $RETAIN_DIR, found ${#CANDIDATES[@]} (sibling tarballs would cross unrechecked; fail closed)." >&2
            ls -la "$RETAIN_DIR" >&2 || true
            exit 1
          fi
          TARBALL="${CANDIDATES[0]}"
          test -s "$TARBALL"
          test -s "$RETAIN_DIR/npm-provenance.json"
          test -s "$RETAIN_DIR/npm-identity.digest"
          node scripts/ci/verify-artifact-provenance.mjs --recheck "$TARBALL" "$RETAIN_DIR/npm-provenance.json"
          # Pin the EXACT verified filename for the upload step (no glob).
          BASENAME="$(basename "$TARBALL")"
          case "$BASENAME" in *.tgz) ;; *) echo "Refusing upload: verified file $BASENAME is not a .tgz (fail closed)." >&2; exit 1;; esac
          if [ -z "${GITHUB_ENV:-}" ]; then
            echo "Refusing upload: GITHUB_ENV is empty/unset; cannot pin VERIFIED_TARBALL_BASENAME=$BASENAME (fail closed)." >&2
            exit 1
          fi
          echo "VERIFIED_TARBALL_BASENAME=$BASENAME" >> "$GITHUB_ENV"
          echo "Verified exact tarball for upload: $BASENAME"

      - name: Refuse empty verified basename before upload (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          # Belt and suspenders: the upload path expands
          # ${{ env.VERIFIED_TARBALL_BASENAME }} — if empty it becomes the
          # retain DIRECTORY and siblings upload unrechecked. Refuse empty here.
          [ -n "$VERIFIED_TARBALL_BASENAME" ] || exit 1
          case "$VERIFIED_TARBALL_BASENAME" in *.tgz) ;; *) echo "Refusing upload: VERIFIED_TARBALL_BASENAME=$VERIFIED_TARBALL_BASENAME is not a .tgz (fail closed)." >&2; exit 1;; esac
          echo "Verified basename present for upload: $VERIFIED_TARBALL_BASENAME"

      - name: Retain release tarball for retry
        uses: actions/upload-artifact@v4
        with:
          name: aeh-npm-tarball
          # U1 (round-4): EXACT verified file only, no glob. The recheck step
          # pins VERIFIED_TARBALL_BASENAME (= deterministic
          # package-name-version.tgz); a sibling landing between guard and
          # upload is never named and cannot escape.
          path: |
            ${{ runner.temp }}/aeh-npm-retained/${{ env.VERIFIED_TARBALL_BASENAME }}
            ${{ runner.temp }}/aeh-npm-retained/npm-provenance.json
            ${{ runner.temp }}/aeh-npm-retained/npm-identity.digest
          if-no-files-found: error
          overwrite: true

      - name: Publish to npm
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          # Reuse THE SAME retained tarball (no repack); pack fresh only when no
          # retained artifact exists (first attempt / offline). Never repack for compare.
          # Provenance gate: reuse requires the sidecar (release_sha + digest +
          # name/version) to verify; absent/invalid/mismatch fails closed
          # (refuse publish AND Release). Fresh-pack writes a new sidecar.
          test -n "${RELEASE_SHA:-}"
          RETAIN_DIR="${RUNNER_TEMP:-$PWD}/aeh-npm-retained"
          mkdir -p "$RETAIN_DIR"
          if ls "$RETAIN_DIR"/*.tgz >/dev/null 2>&1; then
            TARBALL="$(ls "$RETAIN_DIR"/*.tgz | head -n 1)"
            if [ ! -f "$RETAIN_DIR/npm-provenance.json" ]; then
              echo "Refusing to publish $PACKAGE_NAME@$RELEASE_VERSION: missing provenance sidecar npm-provenance.json for release_sha=$RELEASE_SHA (fail closed; stale/replaced artifact? refusing publish and Release)." >&2
              exit 1
            fi
            node scripts/ci/verify-artifact-provenance.mjs --tarball "$TARBALL" --provenance "$RETAIN_DIR/npm-provenance.json" --release-sha "$RELEASE_SHA" --name "$PACKAGE_NAME" --version "$RELEASE_VERSION" || {
              echo "Refusing to publish $PACKAGE_NAME@$RELEASE_VERSION: provenance verification failed for release_sha=$RELEASE_SHA (fail closed; refusing publish and Release)." >&2
              exit 1
            }
            echo "Reusing retained tarball $TARBALL (no repack; provenance verified)."
          else
            PACK_OUT="$(npm pack --pack-destination "$RETAIN_DIR" --silent)"
            if [ -n "${PACK_OUT:-}" ] && [ -f "$RETAIN_DIR/$PACK_OUT" ]; then
              TARBALL="$RETAIN_DIR/$PACK_OUT"
            else
              TARBALL="$(ls "$RETAIN_DIR"/*.tgz | head -n 1)"
            fi
            node scripts/ci/verify-artifact-provenance.mjs --write --tarball "$TARBALL" --provenance "$RETAIN_DIR/npm-provenance.json" --release-sha "$RELEASE_SHA"
            node -e "const fs=require('node:fs'),crypto=require('node:crypto');const b=fs.readFileSync(process.argv[1]);process.stdout.write('sha512-'+crypto.createHash('sha512').update(b).digest('base64')+'\n')" "$TARBALL" > "$RETAIN_DIR/npm-identity.digest" || true
            echo "Packed $TARBALL (first pack retained for retry; provenance recorded)."
          fi
          test -s "$TARBALL"
          # Canonical identity gate against THE SAME bytes (mismatch fails closed).
          if node scripts/ci/verify-npm-identity.mjs "$PACKAGE_NAME" "$RELEASE_VERSION" --tarball "$TARBALL"; then
            echo "Version $RELEASE_VERSION verified identical on npm; skipping publish (idempotent resume, nothing to republish, already on npm)."
          else
            code=$?
            if [ "$code" -eq 2 ]; then
              if [ -n "${NPM_TOKEN:-}" ]; then
                export NODE_AUTH_TOKEN="$NPM_TOKEN"
              fi
              # TOCTOU bind: recompute sha512 of the exact bytes about to be
              # published IN THE SAME shell step, immediately before the
              # publish invocation (fail closed on mismatch). This NARROWS the
              # window but cannot CLOSE a file-based handoff to a separate
              # `npm publish` process: a swap after the recheck needs NO
              # preimage (any bytes publish). The gap is closed by
              # POST-PUBLISH ATTESTATION below (registry ground truth +
              # deprecate). Threat model: runner-local swap only (requires
              # workspace-write on this runner mid-step; NOT remotely
              # exploitable) — attestation converts silent compromise to
              # detected-and-deprecated with bounded blast radius.
              node scripts/ci/verify-artifact-provenance.mjs --recheck "$TARBALL" "$RETAIN_DIR/npm-provenance.json" || {
                echo "Refusing to publish $PACKAGE_NAME@$RELEASE_VERSION: tarball changed between verify and publish (TOCTOU recheck failed, fail closed)." >&2
                exit 1
              }
              npm publish "$TARBALL" --provenance
              # POST-PUBLISH ATTESTATION (U2, propagation-tolerant): query the
              # registry ground truth (`npm view <name>@<version>
              # dist.integrity` via the canonical identity gate) and compare to
              # the sidecar digest. The registry may lag a successful `npm
              # publish` by minutes (incident run 37762308471: `npm view` ~1s
              # after publish saw absence, treated as MISMATCH, and attempted
              # a nonsense deprecate — the integrity LATER matched the sidecar
              # exactly). Poll with bounded backoff — up to 10 min at ~20s
              # intervals by default (AEH_ATTEST_DEADLINE_S /
              # AEH_ATTEST_INTERVAL_S override for tests) — awaiting EITHER
              # present-integrity OR a stable answer (policy evidence 2026-10-08:
              # 0.16.10's npm propagation tail exceeded the old 300s deadline
              # (>5min lag; 0.16.9 had failed the earlier immediate check on a
              # ~1-2min lag before polling existed) — both published fine with
              # integrity later matching exactly — so the default is
              # 600s, not 300s):
               #   exit 0 (present + equal) -> PASS, proceed to Release
               #     (post-deadline success is still ACCEPTED but traced
               #     deadline-exceeded: the deadline bounds CI step duration,
               #     not attestation truth);
              #   exit 1 (present + different) -> PROVEN mismatch -> fail LOUDLY
              #     + `npm deprecate` (bounded retry, never silent) + trace;
              #   exit 2 (authoritative-absent) -> repoll awaiting appearance
              #     (propagation lag); past the deadline fail LOUDLY as UNKNOWN
              #     WITHOUT deprecate (absence is NEVER mismatch: nothing visible
              #     to deprecate; human triage via the trace + runbook below).
              #   exit 3 VISIBLE_UNREADABLE (version visible, digests
              #     missing/malformed — helper threads the machine-readable
              #     VISIBLE_UNREADABLE prefix) -> repoll with a DIFFERENT triage
              #     message (version visible, identity unreadable — suspicious,
              #     bounded retries then loud fail + human runbook, still NO
              #     auto-deprecate since mismatch unproven). Decision (round-2
              #     B2): persistent visible-unreadable past the deadline must
              #     NOT deprecate — deprecating would nuke a GOOD version on
              #     unproven suspicion (mismatch requires exit 1 proven
              #     inequality). Loud fail + runbook instead.
               #   exit 3 generic / per-query timeout (exit 124) -> repoll as
               #     UNKNOWN-retry; past the deadline loud UNKNOWN WITHOUT
               #     deprecate. The per-query timeout is min(configured query
               #     timeout, remaining seconds) AND the retry sleep is
               #     min(interval, remaining), so the only path that runs past
               #     END is the final in-flight query bounded by min(); with no
               #     remaining budget no further query is issued at all and no
               #     sleep is taken (straight to deadline handling).
              # Trust boundary (U3): attestation trusts the npm registry TLS
              # channel — dist.integrity as served over TLS is the ground truth
              # for what installers receive. A registry compromise or a valid-TLS
              # MITM that serves attacker bytes with matching integrity is
              # explicitly outside threat model (no client-side gate can
              # detect a lying registry).
              SIDECAR_DIGEST="$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8')).tarball_sha512)" "$RETAIN_DIR/npm-provenance.json")"
              # Override validation (fail-closed, reject-invalid, round-2 B1):
              # - unset -> defaults (deadline 600s/10min, interval 20s,
              #   query-timeout 60s via `timeout 60s` per query).
              #   Policy: deadline 300s->600s after 0.16.10's npm tail exceeded 300s
              #   (>5min, observed 2026-10-08; 0.16.9 had failed the earlier
              #   immediate check on ~1-2min lag before polling existed);
              #   interval 10s->20s proportionally so the worst-case query count
              #   stays ~30 (600/20 == 300/10, CI cost sane). Per-query timeout
              #   UNCHANGED at 60s; wall-clock exactness + fail-closed semantics
              #   UNCHANGED (pure policy-constant change, no mechanism change).
              # - set (even empty) but non-numeric or out-of-range -> LOUD FAIL
              #   (explicit config error, never silently clamped/defaulted —
              #   clamping would hide CI typos and let huge overrides extend
              #   indefinitely). Ranges UNCHANGED: deadline 1..1800s (<=30min),
              #   interval 5..120s, query-timeout 1..120s — new defaults (600s,
              #   20s, 60s) remain interior, so no rescaling needed; the 1800s
              #   cap still bounds the CI step duration. Document: invalid
              #   override = explicit config error -> fail loudly.
              ATTEST_DEADLINE_RAW="${AEH_ATTEST_DEADLINE_S-__unset__}"
              ATTEST_INTERVAL_RAW="${AEH_ATTEST_INTERVAL_S-__unset__}"
              ATTEST_QTIMEOUT_RAW="${AEH_ATTEST_QUERY_TIMEOUT_S-__unset__}"
              if [ "$ATTEST_DEADLINE_RAW" = "__unset__" ]; then ATTEST_DEADLINE_S=600; else ATTEST_DEADLINE_S="$ATTEST_DEADLINE_RAW"; fi
              if [ "$ATTEST_INTERVAL_RAW" = "__unset__" ]; then ATTEST_INTERVAL_S=20; else ATTEST_INTERVAL_S="$ATTEST_INTERVAL_RAW"; fi
              if [ "$ATTEST_QTIMEOUT_RAW" = "__unset__" ]; then ATTEST_QUERY_TIMEOUT_S=60; else ATTEST_QUERY_TIMEOUT_S="$ATTEST_QTIMEOUT_RAW"; fi
              case "$ATTEST_DEADLINE_S" in ''|*[!0-9]*) echo "Refusing post-publish attestation: AEH_ATTEST_DEADLINE_S=${ATTEST_DEADLINE_RAW} invalid (must be integer 1..1800s, <=30min; unset for default 600). Explicit override rejected (fail-closed, not clamped)." >&2; exit 1;; esac
              case "$ATTEST_INTERVAL_S" in ''|*[!0-9]*) echo "Refusing post-publish attestation: AEH_ATTEST_INTERVAL_S=${ATTEST_INTERVAL_RAW} invalid (must be integer 5..120s; unset for default 20). Explicit override rejected (fail-closed, not clamped)." >&2; exit 1;; esac
              case "$ATTEST_QUERY_TIMEOUT_S" in ''|*[!0-9]*) echo "Refusing post-publish attestation: AEH_ATTEST_QUERY_TIMEOUT_S=${ATTEST_QTIMEOUT_RAW} invalid (must be integer 1..120s; unset for default 60). Explicit override rejected (fail-closed, not clamped)." >&2; exit 1;; esac
              if [ "$ATTEST_DEADLINE_S" -lt 1 ] || [ "$ATTEST_DEADLINE_S" -gt 1800 ]; then echo "Refusing post-publish attestation: AEH_ATTEST_DEADLINE_S=${ATTEST_DEADLINE_S} invalid (must be integer 1..1800s, <=30min; unset for default 600). Explicit override rejected (fail-closed, not clamped)." >&2; exit 1; fi
              if [ "$ATTEST_INTERVAL_S" -lt 5 ] || [ "$ATTEST_INTERVAL_S" -gt 120 ]; then echo "Refusing post-publish attestation: AEH_ATTEST_INTERVAL_S=${ATTEST_INTERVAL_S} invalid (must be integer 5..120s; unset for default 20). Explicit override rejected (fail-closed, not clamped)." >&2; exit 1; fi
              if [ "$ATTEST_QUERY_TIMEOUT_S" -lt 1 ] || [ "$ATTEST_QUERY_TIMEOUT_S" -gt 120 ]; then echo "Refusing post-publish attestation: AEH_ATTEST_QUERY_TIMEOUT_S=${ATTEST_QUERY_TIMEOUT_S} invalid (must be integer 1..120s; unset for default 60). Explicit override rejected (fail-closed, not clamped)." >&2; exit 1; fi
              # Wall-clock deadline (round-2 B1 + round-3 exactness + round-4
              # single-check-point): END epoch computed ONCE from now +
              # deadline. The deadline bounds CI STEP duration, not attestation
              # truth. Wall clock is checked ONCE immediately after EVERY
              # query return (SINGLE check point — no return path bypasses it)
              # and the exceeded flag is recorded BEFORE dispatch by exit code:
              #   - success (exit 0) -> ACCEPT even post-deadline (proven
              #     attestation) but TRACE deadline-exceeded (observability);
              #   - mismatch (exit 1) -> PROVEN inequality -> deprecate+fail
              #     even post-deadline (the deadline doesn't un-prove
              #     inequality) but TRACE deadline-exceeded when exceeded;
              #   - unknown (all other exits) -> post-deadline UNKNOWN fail (no
              #     more retries), else bounded-retry.
              # Per-query timeout is bounded by the remaining budget (round-3
              # D2 + round-4 C2): effective timeout = min(configured query
              # timeout, remaining seconds); the retry sleep is likewise
              # min(interval, remaining) and remaining <= 0 skips sleep
              # straight to deadline handling. When remaining <= 0 (below the
              # 1s floor) NO further query is issued — go directly to
              # deadline-exceeded handling. The ONLY path that runs past END
              # is the final in-flight query bounded by min().
              ATTEST_START="$(date +%s)"
              ATTEST_END=$((ATTEST_START + ATTEST_DEADLINE_S))
              ATTEST_LAST_CODE=0
              ATTEST_LAST_KIND="unknown"
              ATTEST_LAST_OUT=""
              attest_fail_deadline() {
                ATTEST_FAIL_NOW="$(date +%s)"
                ATTEST_FAIL_ELAPSED=$((ATTEST_FAIL_NOW - ATTEST_START))
                if [ "$ATTEST_LAST_KIND" = "visible-unreadable" ]; then
                  echo "Post-publish attestation UNKNOWN (VISIBLE_UNREADABLE) for $PACKAGE_NAME@$RELEASE_VERSION: version visible but identity unreadable ${ATTEST_DEADLINE_S}s after publish (last exit $ATTEST_LAST_CODE; suspicious — registry serves the version but digests are missing/malformed, mismatch UNPROVEN so NOTHING is deprecated; deprecating would nuke a good version)." >&2
                  echo "HUMAN TRIAGE REQUIRED: version is VISIBLE with UNREADABLE identity — suspicious, inspect immediately (possible registry incident or metadata corruption; do NOT auto-deprecate on suspicion)." >&2
                  echo "  version: $PACKAGE_NAME@$RELEASE_VERSION" >&2
                  echo "  sidecar digest: $SIDECAR_DIGEST" >&2
                  echo "  inspect: npm view \"$PACKAGE_NAME@$RELEASE_VERSION\" dist.integrity" >&2
                  echo "  inspect: npm view \"$PACKAGE_NAME@$RELEASE_VERSION\" version" >&2
                  echo "  if present + equal: Release may proceed on retry (propagation settled)." >&2
                  echo "  if present + different: npm deprecate \"$PACKAGE_NAME@$RELEASE_VERSION\" \"aeh: integrity mismatch (post-publish attestation failed; do not install)\"" >&2
                  echo "  decision: mismatch unproven -> cannot deprecate (would nuke a good version). Loud fail + runbook." >&2
                  echo "Post-publish attestation trace: package=$PACKAGE_NAME version=$RELEASE_VERSION sidecar_digest=$SIDECAR_DIGEST result=UNKNOWN-no-deprecate reason=VISIBLE_UNREADABLE exit=$ATTEST_LAST_CODE elapsed_s=$ATTEST_FAIL_ELAPSED deadline_s=$ATTEST_DEADLINE_S" >&2
                  exit 1
                fi
                echo "Post-publish attestation UNKNOWN for $PACKAGE_NAME@$RELEASE_VERSION: registry integrity still absent/unreadable ${ATTEST_DEADLINE_S}s after publish (last exit $ATTEST_LAST_CODE, last-kind $ATTEST_LAST_KIND; propagation lag or registry incident — absence is NEVER mismatch, so NOTHING is deprecated)." >&2
                echo "HUMAN TRIAGE REQUIRED: do NOT deprecate blindly (the version may be absent or still propagating)." >&2
                echo "  version: $PACKAGE_NAME@$RELEASE_VERSION" >&2
                echo "  sidecar digest: $SIDECAR_DIGEST" >&2
                echo "  inspect: npm view \"$PACKAGE_NAME@$RELEASE_VERSION\" dist.integrity" >&2
                echo "  if present + equal: Release may proceed on retry (propagation settled)." >&2
                echo "  if present + different: npm deprecate \"$PACKAGE_NAME@$RELEASE_VERSION\" \"aeh: integrity mismatch (post-publish attestation failed; do not install)\"" >&2
                echo "Post-publish attestation trace: package=$PACKAGE_NAME version=$RELEASE_VERSION sidecar_digest=$SIDECAR_DIGEST result=UNKNOWN-no-deprecate reason=$ATTEST_LAST_KIND exit=$ATTEST_LAST_CODE elapsed_s=$ATTEST_FAIL_ELAPSED deadline_s=$ATTEST_DEADLINE_S" >&2
                exit 1
              }
              while true; do
                ATTEST_NOW="$(date +%s)"
                ATTEST_REMAINING=$((ATTEST_END - ATTEST_NOW))
                if [ "$ATTEST_REMAINING" -le 0 ]; then
                  attest_fail_deadline
                fi
                if [ "$ATTEST_QUERY_TIMEOUT_S" -lt "$ATTEST_REMAINING" ]; then
                  ATTEST_EFFECTIVE_TIMEOUT_S="$ATTEST_QUERY_TIMEOUT_S"
                else
                  ATTEST_EFFECTIVE_TIMEOUT_S="$ATTEST_REMAINING"
                fi
                ATTEST_TMP="$(mktemp)"
                attest_code=0
                timeout "${ATTEST_EFFECTIVE_TIMEOUT_S}s" node scripts/ci/verify-npm-identity.mjs "$PACKAGE_NAME" "$RELEASE_VERSION" --local-digest "$SIDECAR_DIGEST" >"$ATTEST_TMP" 2>&1 || attest_code=$?
                # SINGLE check point (round-4 C1): wall clock ONCE immediately
                # after EVERY query return — no return path bypasses this check.
                # The exceeded flag is recorded BEFORE dispatch by exit code.
                ATTEST_AFTER="$(date +%s)"
                ATTEST_AFTER_ELAPSED=$((ATTEST_AFTER - ATTEST_START))
                ATTEST_OUT="$(cat "$ATTEST_TMP" || true)"
                rm -f "$ATTEST_TMP"
                if [ "$ATTEST_AFTER" -ge "$ATTEST_END" ]; then
                  ATTEST_EXCEEDED=1
                else
                  ATTEST_EXCEEDED=0
                fi
                if [ "$attest_code" -eq 0 ]; then
                  printf '%s\n' "$ATTEST_OUT"
                  if [ "$ATTEST_EXCEEDED" -eq 1 ]; then
                    echo "Post-publish attestation verified: $PACKAGE_NAME@$RELEASE_VERSION registry integrity matches sidecar $SIDECAR_DIGEST (deadline-exceeded: success returned ${ATTEST_AFTER_ELAPSED}s after publish against a ${ATTEST_DEADLINE_S}s deadline — the deadline bounds CI step duration, not attestation truth, so this proven attestation is ACCEPTED)."
                    echo "Post-publish attestation trace: package=$PACKAGE_NAME version=$RELEASE_VERSION sidecar_digest=$SIDECAR_DIGEST result=VERIFIED-deadline-exceeded elapsed_s=$ATTEST_AFTER_ELAPSED deadline_s=$ATTEST_DEADLINE_S"
                  else
                    echo "Post-publish attestation verified: $PACKAGE_NAME@$RELEASE_VERSION registry integrity matches sidecar $SIDECAR_DIGEST."
                  fi
                  break
                elif [ "$attest_code" -eq 1 ]; then
                  printf '%s\n' "$ATTEST_OUT" >&2
                  if [ "$ATTEST_EXCEEDED" -eq 1 ]; then
                    echo "Post-publish attestation FAILED for $PACKAGE_NAME@$RELEASE_VERSION: registry integrity != sidecar $SIDECAR_DIGEST (PROVEN mismatch, exit 1; deadline-exceeded: mismatch returned ${ATTEST_AFTER_ELAPSED}s after publish against a ${ATTEST_DEADLINE_S}s deadline — the deadline bounds CI step duration, not attestation truth, so this proven inequality still deprecates+FAILS)." >&2
                  else
                    echo "Post-publish attestation FAILED for $PACKAGE_NAME@$RELEASE_VERSION: registry integrity != sidecar $SIDECAR_DIGEST (PROVEN mismatch, exit 1; recheck→publish swap? failing LOUDLY and deprecating to block installs)." >&2
                  fi
                  DEPRECATE_MSG="aeh: integrity mismatch (post-publish attestation failed; do not install)"
                  DEPRECATE_OK=0
                  for attempt in 1 2 3; do
                    if npm deprecate "$PACKAGE_NAME@$RELEASE_VERSION" "$DEPRECATE_MSG"; then
                      DEPRECATE_OK=1
                      break
                    fi
                    echo "Deprecate attempt $attempt/3 failed for $PACKAGE_NAME@$RELEASE_VERSION; retrying..." >&2
                    sleep 5
                  done
                  if [ "$DEPRECATE_OK" -ne 1 ]; then
                    echo "MANUAL-DEPRECATE REQUIRED: automatic deprecate failed after 3 attempts." >&2
                    echo "  version: $PACKAGE_NAME@$RELEASE_VERSION" >&2
                    echo "  reason: post-publish attestation mismatch (registry integrity != sidecar $SIDECAR_DIGEST); published bytes are UNTRUSTED, block installs immediately." >&2
                    echo "  command: npm deprecate \"$PACKAGE_NAME@$RELEASE_VERSION\" \"$DEPRECATE_MSG\"" >&2
                  fi
                  if [ "$ATTEST_EXCEEDED" -eq 1 ]; then
                    echo "Post-publish attestation trace: package=$PACKAGE_NAME version=$RELEASE_VERSION sidecar_digest=$SIDECAR_DIGEST result=FAILED-deprecated-deadline-exceeded exit=$attest_code deprecate_ok=$DEPRECATE_OK elapsed_s=$ATTEST_AFTER_ELAPSED deadline_s=$ATTEST_DEADLINE_S" >&2
                  else
                    echo "Post-publish attestation trace: package=$PACKAGE_NAME version=$RELEASE_VERSION sidecar_digest=$SIDECAR_DIGEST result=FAILED-deprecated exit=$attest_code deprecate_ok=$DEPRECATE_OK elapsed_s=$ATTEST_AFTER_ELAPSED deadline_s=$ATTEST_DEADLINE_S" >&2
                  fi
                  exit 1
                else
                  if [ "$attest_code" -eq 124 ]; then
                    ATTEST_LAST_CODE=124
                    ATTEST_LAST_KIND="timeout"
                    ATTEST_LAST_OUT="$ATTEST_OUT"
                  elif [ "$attest_code" -eq 2 ]; then
                    ATTEST_LAST_CODE=2
                    ATTEST_LAST_KIND="absent"
                    ATTEST_LAST_OUT="$ATTEST_OUT"
                  elif printf '%s' "$ATTEST_OUT" | grep -q "VISIBLE_UNREADABLE"; then
                    ATTEST_LAST_CODE="$attest_code"
                    ATTEST_LAST_KIND="visible-unreadable"
                    ATTEST_LAST_OUT="$ATTEST_OUT"
                  else
                    ATTEST_LAST_CODE="$attest_code"
                    ATTEST_LAST_KIND="unknown"
                    ATTEST_LAST_OUT="$ATTEST_OUT"
                  fi
                  if [ "$ATTEST_EXCEEDED" -eq 1 ]; then
                    attest_fail_deadline
                  fi
                  # Bounded retry sleep (round-4 C2): sleep the minimum of the
                  # configured interval and the remaining budget; with no
                  # remaining budget skip sleep straight to deadline handling.
                  ATTEST_SLEEP_NOW="$(date +%s)"
                  ATTEST_SLEEP_REMAINING=$((ATTEST_END - ATTEST_SLEEP_NOW))
                  if [ "$ATTEST_SLEEP_REMAINING" -le 0 ]; then
                    attest_fail_deadline
                  fi
                  if [ "$ATTEST_INTERVAL_S" -lt "$ATTEST_SLEEP_REMAINING" ]; then
                    ATTEST_SLEEP_S="$ATTEST_INTERVAL_S"
                  else
                    ATTEST_SLEEP_S="$ATTEST_SLEEP_REMAINING"
                  fi
                  ATTEST_WALL_ELAPSED=$((ATTEST_SLEEP_NOW - ATTEST_START))
                  if [ "$ATTEST_LAST_KIND" = "absent" ]; then
                    echo "Post-publish attestation pending for $PACKAGE_NAME@$RELEASE_VERSION (exit 2, authoritative-absent: version not yet visible, awaiting appearance — propagation lag? retrying in ${ATTEST_SLEEP_S}s, wall-clock ${ATTEST_WALL_ELAPSED}s/${ATTEST_DEADLINE_S}s)..." >&2
                  elif [ "$ATTEST_LAST_KIND" = "visible-unreadable" ]; then
                    echo "Post-publish attestation pending for $PACKAGE_NAME@$RELEASE_VERSION (exit $ATTEST_LAST_CODE VISIBLE_UNREADABLE: version visible but identity unreadable — suspicious, mismatch UNPROVEN so NOT auto-deprecating; bounded retries, retrying in ${ATTEST_SLEEP_S}s, wall-clock ${ATTEST_WALL_ELAPSED}s/${ATTEST_DEADLINE_S}s)..." >&2
                  elif [ "$ATTEST_LAST_KIND" = "timeout" ]; then
                    echo "Post-publish attestation pending for $PACKAGE_NAME@$RELEASE_VERSION (per-query timeout after ${ATTEST_EFFECTIVE_TIMEOUT_S}s, UNKNOWN-retry, retrying in ${ATTEST_SLEEP_S}s, wall-clock ${ATTEST_WALL_ELAPSED}s/${ATTEST_DEADLINE_S}s)..." >&2
                  else
                    echo "Post-publish attestation pending for $PACKAGE_NAME@$RELEASE_VERSION (exit $ATTEST_LAST_CODE, registry UNKNOWN-retry, retrying in ${ATTEST_SLEEP_S}s, wall-clock ${ATTEST_WALL_ELAPSED}s/${ATTEST_DEADLINE_S}s)..." >&2
                  fi
                  sleep "$ATTEST_SLEEP_S"
                fi
              done
            elif [ "$code" -eq 3 ]; then
              echo "Refusing to publish $PACKAGE_NAME@$RELEASE_VERSION: registry lookup UNKNOWN (network/auth/parse, fail closed, never publish on UNKNOWN)." >&2
              exit 1
            else
              echo "Refusing to publish $PACKAGE_NAME@$RELEASE_VERSION: registry tarball content differs from the local build (integrity mismatch, fail closed)." >&2
              exit 1
            fi
          fi

      - name: Confirm published version is on npm
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          npm view "$PACKAGE_NAME@$RELEASE_VERSION" version --json
          test "$(npm view "$PACKAGE_NAME@$RELEASE_VERSION" version)" = "$RELEASE_VERSION"
          # Existence is not identity: fail closed unless the registry tarball
          # byte-matches THE SAME retained tarball (integrity mismatch).
          # Provenance gate: the retained tarball must still bind to this run's
          # release_sha (absent/invalid/mismatch refuses Release).
          test -n "${RELEASE_SHA:-}"
          RETAIN_DIR="${RUNNER_TEMP:-$PWD}/aeh-npm-retained"
          TARBALL="$(ls "$RETAIN_DIR"/*.tgz 2>/dev/null | head -n 1 || true)"
          if [ -z "${TARBALL:-}" ]; then
            echo "Missing retained tarball for confirm (fail closed; refusing to repack)." >&2
            exit 1
          fi
          if [ ! -f "$RETAIN_DIR/npm-provenance.json" ]; then
            echo "Refusing Release for $PACKAGE_NAME@$RELEASE_VERSION: missing provenance sidecar npm-provenance.json for release_sha=$RELEASE_SHA (fail closed; stale/replaced artifact? refusing publish and Release)." >&2
            exit 1
          fi
          node scripts/ci/verify-artifact-provenance.mjs --tarball "$TARBALL" --provenance "$RETAIN_DIR/npm-provenance.json" --release-sha "$RELEASE_SHA" --name "$PACKAGE_NAME" --version "$RELEASE_VERSION" || {
            echo "Refusing Release for $PACKAGE_NAME@$RELEASE_VERSION: provenance verification failed for release_sha=$RELEASE_SHA (fail closed)." >&2
            exit 1
          }
          # TOCTOU bind: recompute sha512 of the exact bytes about to be
          # consumed by the identity gate IN THE SAME shell step, immediately
          # before it (fail closed on mismatch). This NARROWS the window but
          # cannot CLOSE a file-based handoff: a swap after the recheck needs
          # NO preimage. Threat model: runner-local swap only (requires
          # workspace-write on this runner mid-step; NOT remotely
          # exploitable); the identity gate hashes the consumed bytes, so a
          # swapped file fails closed as a mismatch (never a silent Release).
          node scripts/ci/verify-artifact-provenance.mjs --recheck "$TARBALL" "$RETAIN_DIR/npm-provenance.json" || {
            echo "Refusing Release for $PACKAGE_NAME@$RELEASE_VERSION: tarball changed between verify and confirm (TOCTOU recheck failed, fail closed)." >&2
            exit 1
          }
          node scripts/ci/verify-npm-identity.mjs "$PACKAGE_NAME" "$RELEASE_VERSION" --tarball "$TARBALL"
          # Digest-only fallback: registry integrity must also match the RECORDED first-pack digest.
          if [ -f "$RETAIN_DIR/npm-identity.digest" ]; then
            RECORDED="$(cat "$RETAIN_DIR/npm-identity.digest")"
            node scripts/ci/verify-npm-identity.mjs "$PACKAGE_NAME" "$RELEASE_VERSION" --local-digest "$RECORDED"
          fi

  release:
    name: release
    needs: [publish, verify-published, publish-npm]
    if: needs.publish.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.publish.outputs.version }}
          fetch-depth: 0

      - name: Confirm verified tag before release
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-list -n 1 "v$RELEASE_VERSION")" = "$RELEASE_SHA"
          test "$(git describe --tags --exact-match HEAD)" = "v$RELEASE_VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1 || \
            gh release create "v${RELEASE_VERSION}" --verify-tag --generate-notes --title "v${RELEASE_VERSION}"

  repair-release:
    name: repair-release
    needs: [publish, verify-published]
    # No always(): with verify-published SKIPPED this job is skipped by needs
    # semantics, and the explicit success requirement chains the repair Release
    # on verification evidence for R in THIS run — never on tag existence.
    if: needs.publish.result == 'success' && needs['verify-published'].result == 'success' && needs.publish.outputs.should_publish != 'true' && github.event_name == 'workflow_dispatch' && inputs.bump == 'current'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      - name: Restore retained release tarball (retry reuse)
        uses: actions/download-artifact@v4
        with:
          name: aeh-npm-tarball
          path: ${{ runner.temp }}/aeh-npm-retained
          if-no-files-found: warn
        continue-on-error: true

      - name: Confirm published-but-unreleased state (SHA-bound)
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Rationale: verification RE-RAN for R in verify-published this run
          # (this job needs its success — a manual/legacy tag alone authorizes
          # nothing). Tag == HEAD plus version match re-establishes identity;
          # npm-confirms-published proves publicity. Proceed ONLY to SHA-bound
          # Release creation (no rebuild/republish); all other states were
          # already refused by the repair gate or failed verification.
          TAG="v${RELEASE_VERSION}"
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TAG_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          test -n "$TAG_SHA"
          test "$TAG_SHA" = "$HEAD_SHA"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          test "$(npm view "$PACKAGE_NAME@$RELEASE_VERSION" version)" = "$RELEASE_VERSION"
          test "$(git describe --tags --exact-match HEAD)" = "$TAG"
          # Existence is not identity: fail closed unless the registry tarball
          # byte-matches THE SAME retained tarball (retain+reuse, integrity
          # mismatch). Repair reuses the retained aeh-npm-tarball artifact
          # (same as publish-npm restore above); it never repacks when the
          # artifact exists. Residual case: no artifact -> pack fresh ONLY when
          # the registry proves absent (exit 2); otherwise fail closed without
          # packing (fresh repacks can differ across retries and would mismatch
          # forever; UNKNOWN exit 3 never releases). Fresh-pack residual is
          # rebuild-nondeterminism-exposed and only for diagnostic when nothing
          # is published (still refuses Release because not published).
          # Provenance gate (Luna blocker fix): R is HEAD_SHA (tag == HEAD
          # verified above); the retained tarball must carry a sidecar binding
          # it to HEAD_SHA (release_sha match + digest recompute + name/version
          # match). Absent/invalid/mismatched sidecar fails closed (refuse
          # Release). Fresh-pack fallback (missing artifact -> probe + refuse)
          # stays as-is.
          RETAIN_DIR="${RUNNER_TEMP:-$PWD}/aeh-npm-retained"
          mkdir -p "$RETAIN_DIR"
          if ls "$RETAIN_DIR"/*.tgz >/dev/null 2>&1; then
            RETAIN_TARBALL="$(ls "$RETAIN_DIR"/*.tgz | head -n 1)"
            if [ ! -f "$RETAIN_DIR/npm-provenance.json" ]; then
              echo "Refusing repair Release for $PACKAGE_NAME@$RELEASE_VERSION: missing provenance sidecar npm-provenance.json for release_sha=$HEAD_SHA (fail closed; stale/replaced artifact? refusing publish and Release)." >&2
              exit 1
            fi
            node scripts/ci/verify-artifact-provenance.mjs --tarball "$RETAIN_TARBALL" --provenance "$RETAIN_DIR/npm-provenance.json" --release-sha "$HEAD_SHA" --name "$PACKAGE_NAME" --version "$RELEASE_VERSION" || {
              echo "Refusing repair Release for $PACKAGE_NAME@$RELEASE_VERSION: provenance verification failed for release_sha=$HEAD_SHA (fail closed)." >&2
              exit 1
            }
            echo "Reusing retained tarball $RETAIN_TARBALL (no repack; rebuild-nondeterminism safe; provenance verified)."
          else
            echo "No retained tarball artifact; probing registry before any fresh pack (residual case)." >&2
            set +e
            node scripts/ci/verify-npm-identity.mjs "$PACKAGE_NAME" "$RELEASE_VERSION" --local-digest "sha512-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==" >/dev/null 2>&1
            probe=$?
            set -e
            if [ "$probe" -eq 2 ]; then
              echo "Registry proves $PACKAGE_NAME@$RELEASE_VERSION absent (exit 2); packing fresh for diagnostic only (residual case: fresh pack is rebuild-nondeterminism-exposed; repair Release requires published bytes, so refusing)." >&2
              npm run build --silent
              RETAIN_TMP="$(mktemp -d)"
              npm pack --pack-destination "$RETAIN_TMP" --silent >/dev/null
              RETAIN_TARBALL="$(ls "$RETAIN_TMP"/*.tgz | head -n 1)"
              echo "Refusing repair Release: $PACKAGE_NAME@$RELEASE_VERSION is absent from npm (nothing published)." >&2
              exit 1
            elif [ "$probe" -eq 3 ]; then
              echo "Refusing repair Release: registry lookup UNKNOWN (fail closed, never release on UNKNOWN)." >&2
              exit 1
            else
              echo "Missing retained tarball for repair (fail closed; refusing to repack over published bytes)." >&2
              exit 1
            fi
          fi
          test -s "$RETAIN_TARBALL"
          # TOCTOU bind: recompute sha512 of the exact bytes about to be
          # consumed by the identity gate IN THE SAME shell step, immediately
          # before it (fail closed on mismatch). This NARROWS the window but
          # cannot CLOSE a file-based handoff: a swap after the recheck needs
          # NO preimage. Threat model: runner-local swap only (requires
          # workspace-write on this runner mid-step; NOT remotely
          # exploitable); the identity gate hashes the consumed bytes, so a
          # swapped file fails closed as a mismatch (never a silent Release).
          node scripts/ci/verify-artifact-provenance.mjs --recheck "$RETAIN_TARBALL" "$RETAIN_DIR/npm-provenance.json" || {
            echo "Refusing repair Release for $PACKAGE_NAME@$RELEASE_VERSION: tarball changed between verify and consume (TOCTOU recheck failed, fail closed)." >&2
            exit 1
          }
          # Repair attestation (U4): mismatch deprecates (retry, never silent) so the bad version is not left installable.
          # Trust boundary (U3): attestation trusts npm registry TLS channel — dist.integrity over TLS is ground truth; registry compromise / valid-TLS MITM outside threat model.
          if node scripts/ci/verify-npm-identity.mjs "$PACKAGE_NAME" "$RELEASE_VERSION" --tarball "$RETAIN_TARBALL"; then
            echo "Repair identity verified: $PACKAGE_NAME@$RELEASE_VERSION registry matches retained bytes."
          else
            repair_code=$?
            echo "Repair identity MISMATCH for $PACKAGE_NAME@$RELEASE_VERSION: registry tarball differs from retained bytes (exit $repair_code; failing LOUDLY and deprecating to block installs)." >&2
            if [ -n "${NPM_TOKEN:-}" ]; then
              export NODE_AUTH_TOKEN="$NPM_TOKEN"
            fi
            REPAIR_DEPRECATE_MSG="aeh: integrity mismatch (repair attestation failed; do not install)"
            REPAIR_DEPRECATE_OK=0
            for attempt in 1 2 3; do
              if npm deprecate "$PACKAGE_NAME@$RELEASE_VERSION" "$REPAIR_DEPRECATE_MSG"; then
                REPAIR_DEPRECATE_OK=1
                break
              fi
              echo "Repair deprecate attempt $attempt/3 failed for $PACKAGE_NAME@$RELEASE_VERSION; retrying..." >&2
              sleep 5
            done
            if [ "$REPAIR_DEPRECATE_OK" -ne 1 ]; then
              echo "MANUAL-DEPRECATE REQUIRED: automatic deprecate failed after 3 attempts." >&2
              echo "  version: $PACKAGE_NAME@$RELEASE_VERSION" >&2
              echo "  reason: repair attestation mismatch (registry integrity != retained bytes); published bytes are UNTRUSTED, block installs immediately." >&2
              echo "  command: npm deprecate \"$PACKAGE_NAME@$RELEASE_VERSION\" \"$REPAIR_DEPRECATE_MSG\"" >&2
            fi
            echo "Repair attestation trace: package=$PACKAGE_NAME version=$RELEASE_VERSION result=FAILED-deprecated exit=$repair_code deprecate_ok=$REPAIR_DEPRECATE_OK" >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1 || \
            gh release create "v${RELEASE_VERSION}" --verify-tag --generate-notes --title "v${RELEASE_VERSION}"
