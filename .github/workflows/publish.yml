name: publish-npm

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version strategy when the current package version is already published
        required: true
        default: auto
        type: choice
        options: [auto, current, patch, minor, major]

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-npm-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.AEH_AUTO_PUBLISH != 'false'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_publish: ${{ steps.version.outputs.should_publish }}
      release_sha: ${{ steps.release-commit.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REQUESTED_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'auto' }}
        run: node scripts/release-version.mjs "$REQUESTED_BUMP" >> "$GITHUB_STEP_SUMMARY"

      - name: Synchronize package metadata
        if: steps.version.outputs.should_publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Validate release candidate
        if: steps.version.outputs.should_publish == 'true'
        run: npm run release:check

      - name: Commit version
        id: release-commit
        if: steps.version.outputs.should_publish == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${RELEASE_VERSION}"
            git push origin HEAD:main
          fi
          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Repair missing GitHub Release for current version
        if: steps.version.outputs.should_publish != 'true' && github.event_name == 'workflow_dispatch' && inputs.bump == 'current'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Narrow repair gate: pre-screen for exactly the published-but-unreleased
          # state. A tag proves NOTHING about verification (manual or legacy tags
          # predate tag-after-verify) — trust is established only by the
          # verify-published job re-running verification for R in THIS run, which
          # the repair-release job needs for success. SHA-binding (tag == HEAD ==
          # version commit) proves identity; npm-confirms-published proves
          # publicity. All other states refuse as before (no
          # verification-skipped Release, no rebuild/republish here — the
          # repair-release job owns the SHA-bound Release creation after verify).
          TAG="v${RELEASE_VERSION}"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          if ! git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Refusing to create GitHub Release for v${RELEASE_VERSION} without in-workflow verification." >&2
            echo "The bump=current repair path cannot skip verification: re-run the full release pipeline so commit -> verify (by SHA) -> tag + npm publish -> release all succeed in one workflow run." >&2
            exit 1
          fi
          PEELED_SHA="$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}')"
          if [ -z "$PEELED_SHA" ]; then
            PEELED_SHA="$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1}')"
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$PEELED_SHA" != "$HEAD_SHA" ]; then
            echo "Refusing to create GitHub Release for v${RELEASE_VERSION}: tag ${TAG} at ${PEELED_SHA} does not match HEAD ${HEAD_SHA} (never force-move)." >&2
            exit 1
          fi
          if [ "$(node -p "require('./package.json').version")" != "$RELEASE_VERSION" ]; then
            echo "Refusing to create GitHub Release for v${RELEASE_VERSION}: HEAD version does not match (SHA-binding failed)." >&2
            exit 1
          fi
          if ! npm view "$PACKAGE_NAME@$RELEASE_VERSION" version --json >/dev/null 2>&1; then
            echo "Refusing to create GitHub Release for v${RELEASE_VERSION}: version is not on npm (nothing published to repair)." >&2
            exit 1
          fi
          echo "Repair eligible: tag ${TAG} at ${PEELED_SHA} == HEAD, version ${RELEASE_VERSION} is on npm. The repair-release job will create the SHA-bound Release (no rebuild/republish)."

      - name: Nothing to publish
        if: steps.version.outputs.should_publish != 'true'
        run: echo "Current package version is already published and bump=current was requested."

  verify-published:
    name: verify-published
    needs: publish
    # Normal path (should_publish) AND repair path (manual dispatch bump=current
    # with nothing to publish): a manually created or legacy tag at R proves
    # nothing, so the repair leg must EXECUTE verification for R in this run —
    # the repair Release job needs this job's success. No Release without it.
    if: needs.publish.outputs.should_publish == 'true' || (needs.publish.outputs.should_publish != 'true' && github.event_name == 'workflow_dispatch' && inputs.bump == 'current')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        if: needs.publish.outputs.should_publish == 'true'
        with:
          ref: ${{ needs.publish.outputs.release_sha }}
          fetch-depth: 0

      - uses: actions/checkout@v6
        if: needs.publish.outputs.should_publish != 'true'
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - run: npm ci

      - name: Confirm release commit
        if: needs.publish.outputs.should_publish == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          git fetch origin "$RELEASE_SHA"
          git checkout --detach "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"

      - name: Confirm repair revision R (tag-bound, SHA-verified)
        if: needs.publish.outputs.should_publish != 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          # Repair leg: resolve R as HEAD and bind it by SHA. The tag is NOT
          # trusted as proof of verification — it is only an identity claim
          # (tag == HEAD, version matches) checked BEFORE the verification steps
          # below execute against these exact bits.
          TAG="v${RELEASE_VERSION}"
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TAG_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          test -n "$TAG_SHA"
          test "$TAG_SHA" = "$HEAD_SHA"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          test "$(git describe --tags --exact-match HEAD)" = "$TAG"
          echo "Repair verification target R=$HEAD_SHA bound to ${TAG}."

      - name: Provision the required consumer toolchain provider
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y podman
          podman --version

      - name: Run packaged build and hygiene contracts
        run: npm run test:packaged-consumer

      - name: Smoke packaged CLI from consumer install
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          npm run build
          PACKAGE_NAME="$(node -p "require('./package.json').name.replace(/^@/, '').replaceAll('/', '-')")"
          PACK_DESTINATION="$(mktemp -d "$RUNNER_TEMP/aeh-packaged-consumer.XXXXXX")"
          AEH_PACK_DESTINATION="$PACK_DESTINATION" node scripts/ci/packCandidate.mjs
          TGZ="$PACK_DESTINATION/$PACKAGE_NAME-$EXPECTED_VERSION.tgz"
          test -s "$TGZ"
          sha256sum "$TGZ"
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/consumer"
          cd "$TMP/consumer"
          npm init -y >/dev/null
          npm install "$TGZ" >/dev/null
          ./node_modules/.bin/aeh --version | grep -Fx "$EXPECTED_VERSION"
          TOOLS="$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | ./node_modules/.bin/aeh operation mcp)"
          printf '%s\n' "$TOOLS" | grep -q 'aeh_operation_start_audit'
          printf '%s\n' "$TOOLS" | grep -q 'aeh_context_status'
          mkdir repo
          ./node_modules/.bin/aeh init repo
          test -f repo/.harness/project.yaml
          test -f repo/.harness/toolchain.yaml
          test -f repo/.harness/provider-versions.json
          test -f repo/.harness/agents.source.jsonc
          test -f repo/.harness/skills/engineering-workflow/SKILL.md
          test -f repo/.harness/managed-assets.json
          test -f repo/openspec/config.yaml
          grep -q '"aeh:orchestration"' repo/.harness/agents.source.jsonc
          grep -q '^    sessionPolicy: fresh-on-start$' repo/.harness/project.yaml
          grep -q '^    provider: openspec$' repo/.harness/project.yaml
          grep -q 'npm:@fission-ai/openspec' repo/.harness/toolchain.yaml
          test -d repo/.harness/paseo
          test -d repo/.harness/paseo/handoffs
          test -d repo/.harness/audits
          test -d repo/.harness/operations
          grep -q '^\.harness/\*$' repo/.gitignore
          grep -q '^!\.harness/project.yaml$' repo/.gitignore
          grep -q '^!\.harness/toolchain.yaml$' repo/.gitignore
          grep -q '^!\.harness/agents.source.jsonc$' repo/.gitignore
          grep -q '^!\.harness/otel-collector.yaml$' repo/.gitignore
          ./node_modules/.bin/aeh toolchain compile repo
          test -f repo/.config/mise/conf.d/aeh.toml
          grep -q 'openspec' repo/.config/mise/conf.d/aeh.toml
          rm repo/.harness/skills/engineering-workflow/SKILL.md
          ./node_modules/.bin/aeh setup --dry-run repo
          test -f repo/.harness/skills/engineering-workflow/SKILL.md
          ./node_modules/.bin/aeh policy sync repo >/dev/null
          mkdir -p repo/.harness/fixtures
          cat > repo/.harness/fixtures/deterministic-paseo-runtime.json <<'EOF'
          {
            "version": 1,
            "responses": {
              "semantic-assessment:INTENT": [
                {
                  "judgment": {
                    "type": "INTENT",
                    "intent": "audit",
                    "confidence": 1,
                    "evidenceRefs": ["request"]
                  },
                  "claims": [],
                  "assumptions": [],
                  "unknowns": [],
                  "recommendations": [],
                  "knowledgeGaps": []
                }
              ]
            }
          }
          EOF
          AEH_DETERMINISTIC_PASEO_RUNTIME=1 AEH_PASEO_FORCE_CLI=0 ./node_modules/.bin/aeh intent 'review the repo and validate the code for improvements' repo | grep -q '^AUDIT'
          ./node_modules/.bin/aeh operation status DOES-NOT-EXIST repo >/dev/null 2>&1 && exit 1 || true

  publish-npm:
    name: publish-npm
    needs: [publish, verify-published]
    if: needs.publish.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish.outputs.release_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: Create version tag after verification
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          TAG="v${RELEASE_VERSION}"
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            PEELED_SHA="$(git ls-remote origin "refs/tags/${TAG}^{}" | awk '{print $1}')"
            if [ -z "$PEELED_SHA" ]; then
              PEELED_SHA="$(git ls-remote origin "refs/tags/${TAG}" | awk '{print $1}')"
            fi
            if [ "$PEELED_SHA" = "$RELEASE_SHA" ]; then
              echo "Tag ${TAG} already points at $RELEASE_SHA; resuming idempotently (no recreation, never force-move)."
              git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}" || git fetch origin tag "${TAG}"
            else
              echo "Tag ${TAG} already exists on origin at ${PEELED_SHA}, expected $RELEASE_SHA; refusing to reuse a stale tag (never force-move). Nothing has been published by this run." >&2
              exit 1
            fi
          else
            git tag -a "${TAG}" -m "${TAG}" "$RELEASE_SHA"
            git push origin "${TAG}"
          fi
          TAG_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"
          if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
            echo "Tag ${TAG} verification failed: expected $RELEASE_SHA but got $TAG_SHA." >&2
            exit 1
          fi

      - name: Confirm verified tag before publishing
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-list -n 1 "v$RELEASE_VERSION")" = "$RELEASE_SHA"
          test "$(git describe --tags --exact-match HEAD)" = "v$RELEASE_VERSION"

      - run: npm run build

      - name: Publish to npm
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          if npm view "$PACKAGE_NAME@$RELEASE_VERSION" version --json >/dev/null 2>&1; then
            echo "Version $RELEASE_VERSION already on npm; skipping publish (idempotent resume, nothing to republish)."
          else
            if [ -n "${NPM_TOKEN:-}" ]; then
              export NODE_AUTH_TOKEN="$NPM_TOKEN"
            fi
            npm publish --provenance
          fi

      - name: Confirm published version is on npm
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          npm view "$PACKAGE_NAME@$RELEASE_VERSION" version --json
          test "$(npm view "$PACKAGE_NAME@$RELEASE_VERSION" version)" = "$RELEASE_VERSION"

  release:
    name: release
    needs: [publish, verify-published, publish-npm]
    if: needs.publish.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.publish.outputs.version }}
          fetch-depth: 0

      - name: Confirm verified tag before release
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-list -n 1 "v$RELEASE_VERSION")" = "$RELEASE_SHA"
          test "$(git describe --tags --exact-match HEAD)" = "v$RELEASE_VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1 || \
            gh release create "v${RELEASE_VERSION}" --verify-tag --generate-notes --title "v${RELEASE_VERSION}"

  repair-release:
    name: repair-release
    needs: [publish, verify-published]
    # No always(): with verify-published SKIPPED this job is skipped by needs
    # semantics, and the explicit success requirement chains the repair Release
    # on verification evidence for R in THIS run — never on tag existence.
    if: needs.publish.result == 'success' && needs['verify-published'].result == 'success' && needs.publish.outputs.should_publish != 'true' && github.event_name == 'workflow_dispatch' && inputs.bump == 'current'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Confirm published-but-unreleased state (SHA-bound)
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          # Rationale: verification RE-RAN for R in verify-published this run
          # (this job needs its success — a manual/legacy tag alone authorizes
          # nothing). Tag == HEAD plus version match re-establishes identity;
          # npm-confirms-published proves publicity. Proceed ONLY to SHA-bound
          # Release creation (no rebuild/republish); all other states were
          # already refused by the repair gate or failed verification.
          TAG="v${RELEASE_VERSION}"
          git fetch origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TAG_SHA="$(git rev-list -n 1 "refs/tags/${TAG}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          test -n "$TAG_SHA"
          test "$TAG_SHA" = "$HEAD_SHA"
          test "$(node -p "require('./package.json').version")" = "$RELEASE_VERSION"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          test "$(npm view "$PACKAGE_NAME@$RELEASE_VERSION" version)" = "$RELEASE_VERSION"
          test "$(git describe --tags --exact-match HEAD)" = "$TAG"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1 || \
            gh release create "v${RELEASE_VERSION}" --verify-tag --generate-notes --title "v${RELEASE_VERSION}"
