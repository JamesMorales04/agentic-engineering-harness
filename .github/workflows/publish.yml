name: publish-npm

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version strategy when the current package version is already published
        required: true
        default: auto
        type: choice
        options: [auto, current, patch, minor, major]

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-npm-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.AEH_AUTO_PUBLISH != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REQUESTED_BUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'auto' }}
        run: node scripts/release-version.mjs "$REQUESTED_BUMP" >> "$GITHUB_STEP_SUMMARY"

      - name: Synchronize package metadata
        if: steps.version.outputs.should_publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version

      - name: Validate release candidate
        if: steps.version.outputs.should_publish == 'true'
        run: npm run release:check

      - name: Commit version and create tag
        if: steps.version.outputs.should_publish == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${RELEASE_VERSION} [skip ci]"
            git push origin HEAD:main
          fi
          if ! git rev-parse -q --verify "refs/tags/v${RELEASE_VERSION}" >/dev/null; then
            git tag -a "v${RELEASE_VERSION}" -m "v${RELEASE_VERSION}"
            git push origin "v${RELEASE_VERSION}"
          fi

      - name: Publish to npm
        if: steps.version.outputs.should_publish == 'true'
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi
          npm publish --provenance

      - name: Create GitHub Release
        if: steps.version.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1 || \
            gh release create "v${RELEASE_VERSION}" --verify-tag --generate-notes --title "v${RELEASE_VERSION}"

      - name: Repair missing GitHub Release for current version
        if: steps.version.outputs.should_publish != 'true' && github.event_name == 'workflow_dispatch' && inputs.bump == 'current'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v${RELEASE_VERSION}" >/dev/null; then
            gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1 || \
              gh release create "v${RELEASE_VERSION}" --verify-tag --generate-notes --title "v${RELEASE_VERSION}"
          else
            echo "Current npm version is already published, but tag v${RELEASE_VERSION} is absent; refusing to fabricate a release tag."
          fi

      - name: Nothing to publish
        if: steps.version.outputs.should_publish != 'true'
        run: echo "Current package version is already published and bump=current was requested."
