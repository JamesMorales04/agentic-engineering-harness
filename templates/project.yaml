version: 1

project:
  name: change-me

orchestration:
  provider: paseo
  required: false
  worker:
    provider: opencode
    model: null
    maxRepairAttempts: 2

memory:
  provider: engram
  required: false
  benchmark:
    casesDir: memory-benchmarks
    resultsDir: .harness/memory-benchmarks
    providers: []

codeIntelligence:
  provider: graphify
  required: false
  graphPath: graphify-out/graph.json
  snapshotDir: .harness/graphify

sdd:
  specsDir: specs
  contractsDir: .harness/contracts
  reportsDir: .harness/reports
  repairsDir: .harness/repairs
  runsDir: .harness/runs

validation:
  baseRef: main
  requireSeal: true
  frozenPaths:
    - .harness/contracts/**
    - .harness/seals/**
    - tests/acceptance/frozen/**
  commands: []
  validators: []
  opa:
    enabled: false
    policyDirs:
      - .harness/policies/core

security:
  sandbox:
    provider: podman
    required: false
  tools:
    - opengrep
    - trivy

telemetry:
  enabled: true
  required: false
  localEventsFile: .harness/telemetry/events.ndjson
  exporter: none
  serviceName: engineering-harness-consumer

evals:
  corpusDir: evals/corpus
  resultsDir: .harness/evals/results
  workspacesDir: .harness/evals/workspaces

provenance:
  outputDir: .harness/provenance
  buildType: https://github.com/JamesMorales04/agentic-engineering-harness/v0.3
