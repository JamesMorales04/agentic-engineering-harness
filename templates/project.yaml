version: 1

project:
  name: change-me

agents:
  configPath: .harness/agents.source.jsonc
  generatedPath: .harness/generated/agents.json
  activeProfile: balanced
  required: true
  findingsDir: .harness/findings

workflow:
  quick:
    maxFiles: 5
    disallowedDomains:
      - security
      - authentication
      - authorization
      - architecture
      - database
      - schema
      - migration
      - api-contract
      - multi-tenancy
  issueIntake:
    enabled: true
    snapshotDir: .harness/issues
    verifyDriftOnRun: true
    requireOpen: true
    plannerAgent: planner
    autoHandoff: true
  reviews:
    enabled: true
    reviewQuick: false
    leadAcceptance: true
    leadAcceptanceQuick: false
    quality:
      # Integer DebtPoints: 3 points = DebtScore 1. Therefore 3 notes = 1 low.
      severityPoints:
        critical: 300
        high: 75
        medium: 24
        low: 3
        note: 1
    convergence:
      minimumDebtPointImprovement: 3
      stagnationWindow: 2
      cycleDetection: true
      regressionDetection: true
    finalQualityGate:
      maxBySeverity:
        critical: 0
        high: 0
        medium: 0
        low: 3
      maxDebtPoints: 9
    escalation:
      criticalStartStage: 2
      replanResumeStage: 2
      stages:
        - name: normal
          action: remediate
        - name: quality
          action: remediate
          agent: quality-implementer
        - name: senior
          action: remediate
          agent: senior-implementer
          model: "@brain"
        - name: diagnosis
          action: diagnose
          agent: oracle
          model: "@brain"
        - name: replan
          action: replan
          agent: planner
          model: "@brain"

orchestration:
  provider: paseo
  required: false
  worker:
    provider: opencode
    maxRepairAttempts: 2

# MCP servers are injected only into agents whose topology explicitly lists them.
# This keeps large tool schemas out of unrelated agent contexts.
mcp:
  servers:
    context7:
      description: Current library/framework documentation lookup.
      type: remote
      url: https://mcp.context7.com/mcp
      oauth: false
      enabled: true
    playwright:
      description: Browser exploration and stateful UI validation; prefer deterministic Playwright tests when they are sufficient.
      type: local
      command: [npx, -y, "@playwright/mcp@0.0.78"]
      enabled: true
      timeoutMs: 30000
    github:
      description: Official GitHub MCP server in read-only mode for repository/issue/PR/action triage. Deterministic Harness delivery owns writes.
      type: local
      command: [podman, run, -i, --rm, -e, GITHUB_PERSONAL_ACCESS_TOKEN, -e, GITHUB_TOOLSETS, -e, GITHUB_READ_ONLY, ghcr.io/github/github-mcp-server]
      environment:
        GITHUB_PERSONAL_ACCESS_TOKEN: "{env:GITHUB_TOKEN}"
        GITHUB_TOOLSETS: repos,issues,pull_requests,actions
        GITHUB_READ_ONLY: "1"
      enabled: true
      timeoutMs: 30000
    sentry:
      description: Optional production-error and trace investigation via Sentry's remote MCP.
      type: remote
      url: https://mcp.sentry.dev/mcp
      enabled: false
      timeoutMs: 10000

# GitHub reads can use GH_TOKEN/GITHUB_TOKEN when needed. Delivery writes remain explicit opt-in.
delivery:
  stateDir: .harness/delivery
  github:
    enabled: false
    tokenEnv: GH_TOKEN
    assignTokenOwner: true
    labels: []
    branchPattern: feature/gh-{issue}-{slug}
  paseo:
    enabled: false
    createWorkspace: true
    autoUseWorkspace: true
    worktreeSlugPattern: gh-{issue}-{slug}

memory:
  provider: engram
  required: false
  benchmark:
    casesDir: memory-benchmarks
    resultsDir: .harness/memory-benchmarks
    providers: []

codeIntelligence:
  provider: graphify
  required: false
  graphPath: graphify-out/graph.json
  snapshotDir: .harness/graphify

sdd:
  specsDir: specs
  contractsDir: .harness/contracts
  reportsDir: .harness/reports
  repairsDir: .harness/repairs
  runsDir: .harness/runs

validation:
  baseRef: main
  requireSeal: true
  frozenPaths:
    - .harness/contracts/**
    - .harness/seals/**
    - tests/acceptance/frozen/**
  commands: []
  validators: []
  opa:
    enabled: false
    policyDirs:
      - .harness/policies/core

security:
  sandbox:
    provider: podman
    required: false
  tools:
    - opengrep
    - trivy

telemetry:
  enabled: true
  required: false
  localEventsFile: .harness/telemetry/events.ndjson
  exporter: none
  serviceName: engineering-harness-consumer

evals:
  corpusDir: evals/corpus
  resultsDir: .harness/evals/results
  workspacesDir: .harness/evals/workspaces

provenance:
  outputDir: .harness/provenance
  buildType: https://github.com/JamesMorales04/agentic-engineering-harness/v0.4
