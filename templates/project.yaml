version: 1

project:
  name: change-me

orchestration:
  # paseo keeps workers visible/controlable through the Paseo control plane.
  # Set provider: podman for a directly sandboxed OpenCode worker instead.
  provider: paseo
  required: false
  worker:
    provider: opencode
    # model: provider/model
    maxRepairAttempts: 2
    timeoutSeconds: 1800
    titlePrefix: aeh

memory:
  provider: engram
  required: false

codeIntelligence:
  provider: graphify
  required: false
  graphPath: graphify-out/graph.json
  snapshotDir: .harness/graph
  # refreshCommand: your-graph-refresh-command

sdd:
  specsDir: specs
  contractsDir: .harness/contracts
  reportsDir: .harness/reports
  repairsDir: .harness/repairs
  runsDir: .harness/runs

validation:
  baseRef: main
  requireSeal: true
  frozenPaths:
    - .harness/contracts/**
    - .harness/seals/**
    - tests/acceptance/frozen/**
  commands: []
  validators:
    - id: acceptance
      adapter: gherkin
      required: false
    - id: architecture-graph
      adapter: graphify
      required: false
    - id: security-opengrep
      adapter: opengrep
      required: false
    - id: security-trivy
      adapter: trivy
      required: false
  opa:
    enabled: false
    policyDirs:
      - .harness/policies/core

security:
  sandbox:
    provider: podman
    required: false
    # image: your-opencode-worker-image
    network: true
    extraArgs: []
  tools:
    - opengrep
    - trivy

telemetry:
  enabled: true
  localEventsFile: .harness/telemetry/events.ndjson
